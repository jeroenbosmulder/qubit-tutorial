document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

atistics plus magic; it is statistics with the details kept.\" style=\"display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; background:#002157; background-image:repeating-linear-gradient(to right, rgba(255,255,255,0.05) 0 1.5px, transparent 1.5px 48px), repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0 1.5px, transparent 1.5px 48px); color:#FFFFFF; font-family:'Fraunces', Georgia, serif; box-sizing:border-box; padding:100px;\">\n    <img src=\"3922cb65-ea43-41d4-88e1-cb452596cdf7\" alt=\"Bernoulli arch\" style=\"width:170px; height:170px;\">\n    <h1 style=\"font-size:104px; font-weight:700; margin:0; letter-spacing:-2px; text-align:center;\"><span>Build your own qubit<\u002Fspan><\u002Fh1>\n    <p style=\"font-family:'IBM Plex Mono', monospace; font-size:30px; color:#AFE0F7; margin:0; text-align:center;\"><span>quantum is not statistics plus magic — it is statistics with the details kept<\u002Fspan><\u002Fp>\n    <div style=\"display:flex; gap:40px; margin-top:20px; font-family:'IBM Plex Mono', monospace; font-size:24px; color:#FFFFFF;\">\n      <div style=\"display:flex; align-items:center; gap:14px;\"><span style=\"color:#EE7203; font-weight:600;\">I<\u002Fspan><span>a richer space of states<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:14px;\"><span style=\"color:#EE7203; font-weight:600;\">II<\u002Fspan><span>how far apart are two coins?<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:14px;\"><span style=\"color:#EE7203; font-weight:600;\">III<\u002Fspan><span>what the distance means<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Chips kept shrinking\" data-speaker-notes=\"Why quantum, why now — in three beats. Beat one: computing improved for five decades for one dominant reason — the transistors kept getting smaller, so more of them fit on a chip. Plotted on a log scale the count climbs as a straight line: doubling every couple of years, from thousands in 1970 toward a trillion per package around 2030. The whole digital world rides this one curve.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>PROLOGUE · 1 — WHY QUANTUM, WHY NOW<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Computing grew because chips kept shrinking<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>For five decades computing improved for one dominant reason: transistors kept getting <\u002Fspan><strong>smaller<\u002Fstrong><span>, so ever more of them fit on a chip.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>On a log scale the count climbs as a straight line — a doubling every couple of years, from thousands in 1970 toward <\u002Fspan><strong>a trillion per package<\u002Fstrong><span> around 2030.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>The whole digital world rides this one curve.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:30px;\">\n        <svg sc-camel-view-box=\"0 0 900 520\" style=\"width:100%; display:block;\">\n          <line x1=\"110\" y1=\"440\" x2=\"850\" y2=\"440\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fline>\n          <line x1=\"110\" y1=\"440\" x2=\"110\" y2=\"60\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fline>\n          <line x1=\"130\" y1=\"420\" x2=\"760\" y2=\"105\" stroke=\"#5C6E8F\" stroke-width=\"2.5\"><\u002Fline>\n          <line x1=\"760\" y1=\"105\" x2=\"830\" y2=\"70\" stroke=\"#5C6E8F\" stroke-width=\"2.5\" stroke-dasharray=\"7 7\"><\u002Fline>\n          <circle cx=\"146\" cy=\"424\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"172\" cy=\"401\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"198\" cy=\"396\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"224\" cy=\"374\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"252\" cy=\"367\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"278\" cy=\"345\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"306\" cy=\"332\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"330\" cy=\"329\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"358\" cy=\"305\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"384\" cy=\"290\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"412\" cy=\"286\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"438\" cy=\"263\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"466\" cy=\"255\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"492\" cy=\"235\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"519\" cy=\"230\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"546\" cy=\"209\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"573\" cy=\"199\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"600\" cy=\"185\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"627\" cy=\"176\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"654\" cy=\"159\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"681\" cy=\"152\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"708\" cy=\"136\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"735\" cy=\"124\" r=\"7\" fill=\"#EE7203\"><\u002Fcircle>\n          <circle cx=\"830\" cy=\"70\" r=\"9\" fill=\"#FFFFFF\" stroke=\"#EE7203\" stroke-width=\"3.5\"><\u002Fcircle>\n          <text x=\"820\" y=\"40\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#EE7203\">~1 trillion · 2030<\u002Ftext>\n          <text x=\"146\" y=\"482\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">1970<\u002Ftext>\n          <text x=\"480\" y=\"482\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">2000<\u002Ftext>\n          <text x=\"830\" y=\"482\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">2030<\u002Ftext>\n          <text x=\"84\" y=\"250\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\" transform=\"rotate(-90 84 250)\">transistors per chip (log)<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Atomic scales\" data-speaker-notes=\"Beat two: follow the shrinking to its end. 90 nanometers, 65, 45, 32, 22, 14, 10, 7, 3 — the industry now speaks of the angstrom era: a tenth of a nanometer, the width of a single atom. A transistor gate is a few dozen atoms across. Down here the comfortable rules of classical physics — definite places, definite answers — simply stop applying. The shrinking that powered everything has delivered us to the doorstep of a different rulebook.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>PROLOGUE · 2 — THE END OF SMALL<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Shrinking has reached the atoms themselves<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>Follow the shrinking to its end: 90 nm, 65, 45, 32, 22, 14, 10, 7, 3… the industry now speaks of the <\u002Fspan><strong>angstrom era<\u002Fstrong><span> — a tenth of a nanometer. The width of a single atom.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>A transistor's gate is a few <\u002Fspan><em>dozen atoms<\u002Fem><span> across.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>And down here the comfortable rules — definite places, definite answers — <\u002Fspan><strong>stop applying<\u002Fstrong><span>. The shrinking that powered everything has delivered us to a different rulebook.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:30px;\">\n        <svg sc-camel-view-box=\"0 0 900 520\" style=\"width:100%; display:block;\">\n          <line x1=\"90\" y1=\"330\" x2=\"810\" y2=\"330\" stroke=\"#5C6E8F\" stroke-width=\"2\" stroke-dasharray=\"4 5\"><\u002Fline>\n          <rect x=\"100\" y=\"230\" width=\"200\" height=\"200\" rx=\"10\" fill=\"none\" stroke=\"#002157\" stroke-width=\"4\"><\u002Frect>\n          <text x=\"200\" y=\"342\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#002157\">90 nm<\u002Ftext>\n          <rect x=\"350\" y=\"270\" width=\"120\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"#002157\" stroke-width=\"3.5\"><\u002Frect>\n          <text x=\"410\" y=\"338\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#002157\">22 nm<\u002Ftext>\n          <rect x=\"520\" y=\"298\" width=\"64\" height=\"64\" rx=\"6\" fill=\"none\" stroke=\"#002157\" stroke-width=\"3\"><\u002Frect>\n          <text x=\"552\" y=\"288\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#002157\">7 nm<\u002Ftext>\n          <rect x=\"634\" y=\"312\" width=\"36\" height=\"36\" rx=\"5\" fill=\"none\" stroke=\"#002157\" stroke-width=\"3\"><\u002Frect>\n          <text x=\"652\" y=\"302\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#002157\">3 nm<\u002Ftext>\n          <circle cx=\"762\" cy=\"330\" r=\"26\" fill=\"#FDE9D3\"><\u002Fcircle>\n          <circle cx=\"762\" cy=\"330\" r=\"8\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fcircle>\n          <ellipse cx=\"762\" cy=\"330\" rx=\"42\" ry=\"16\" fill=\"none\" stroke=\"#00A1E4\" stroke-width=\"2.5\" transform=\"rotate(-24 762 330)\"><\u002Fellipse>\n          <text x=\"762\" y=\"266\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#EE7203\">1 Å · an atom<\u002Ftext>\n          <text x=\"450\" y=\"470\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#5C6E8F\">five decades of shrinking — the road ends at the atom<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Balls vs waves\" data-speaker-notes=\"Beat three: Young's double-slit experiment, the cleanest sorter of particles from waves. Part I — throw tennis balls at a wall with two slits. Some bounce off, some pass through; mark where they land on a second wall and you get two strips of marks, roughly the shape of the slits. That is what particles do. Part II — shine light of a single color at the same wall. Each slit becomes the source of a fresh ripple; where peak meets peak the ripples reinforce (bright), where peak meets trough they cancel (dark). The second wall shows a whole stripy ladder — the interference pattern. That is what waves do. Two slits, two signatures.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>PROLOGUE · 3 — YOUNG'S DOUBLE SLIT<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Two slits sort particles from waves<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><strong>Tennis balls<\u002Fstrong><span> thrown at a wall with two slits: some bounce, some pass. Mark the hits on a second wall — <\u002Fspan><strong>two strips<\u002Fstrong><span>, the shape of the slits. That is what particles do.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><strong>Light<\u002Fstrong><span> of one color at the same wall: each slit births a fresh ripple. Peak meets peak — bright; peak meets trough — dark. The second wall shows a stripy <\u002Fspan><strong>ladder<\u002Fstrong><span>. That is what waves do.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>Two slits, two signatures. Remember them both.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:30px;\">\n        <svg sc-camel-view-box=\"0 0 900 540\" style=\"width:100%; display:block;\">\n          <rect x=\"120\" y=\"60\" width=\"12\" height=\"120\" fill=\"#002157\"><\u002Frect>\n          <rect x=\"120\" y=\"212\" width=\"12\" height=\"66\" fill=\"#002157\"><\u002Frect>\n          <rect x=\"120\" y=\"310\" width=\"12\" height=\"120\" fill=\"#002157\"><\u002Frect>\n          <circle cx=\"52\" cy=\"160\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"76\" cy=\"230\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"46\" cy=\"300\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"84\" cy=\"340\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"60\" cy=\"386\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle>\n          <rect x=\"330\" y=\"60\" width=\"12\" height=\"370\" fill=\"#002157\"><\u002Frect>\n          <circle cx=\"308\" cy=\"172\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"296\" cy=\"192\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"312\" cy=\"206\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"300\" cy=\"224\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"310\" cy=\"240\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle>\n          <circle cx=\"304\" cy=\"286\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"314\" cy=\"304\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"298\" cy=\"318\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"308\" cy=\"336\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"299\" cy=\"352\" r=\"6\" fill=\"#00A1E4\"><\u002Fcircle>\n          <text x=\"225\" y=\"490\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">balls · two strips<\u002Ftext>\n          <rect x=\"540\" y=\"60\" width=\"12\" height=\"120\" fill=\"#002157\"><\u002Frect>\n          <rect x=\"540\" y=\"212\" width=\"12\" height=\"66\" fill=\"#002157\"><\u002Frect>\n          <rect x=\"540\" y=\"310\" width=\"12\" height=\"120\" fill=\"#002157\"><\u002Frect>\n          <path d=\"M 552 166 A 40 40 0 0 1 552 246\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"2.5\"><\u002Fpath>\n          <path d=\"M 552 126 A 100 100 0 0 1 552 286\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"2.5\"><\u002Fpath>\n          <path d=\"M 552 254 A 40 40 0 0 1 552 334\" fill=\"none\" stroke=\"#00A1E4\" stroke-width=\"2.5\"><\u002Fpath>\n          <path d=\"M 552 214 A 100 100 0 0 1 552 374\" fill=\"none\" stroke=\"#00A1E4\" stroke-width=\"2.5\"><\u002Fpath>\n          <rect x=\"750\" y=\"60\" width=\"12\" height=\"370\" fill=\"#002157\"><\u002Frect>\n          <rect x=\"770\" y=\"76\" width=\"44\" height=\"22\" rx=\"5\" fill=\"#FDE9D3\"><\u002Frect>\n          <rect x=\"770\" y=\"124\" width=\"72\" height=\"22\" rx=\"5\" fill=\"#EE7203\"><\u002Frect>\n          <rect x=\"770\" y=\"172\" width=\"96\" height=\"22\" rx=\"5\" fill=\"#EE7203\"><\u002Frect>\n          <rect x=\"770\" y=\"220\" width=\"104\" height=\"22\" rx=\"5\" fill=\"#EE7203\"><\u002Frect>\n          <rect x=\"770\" y=\"268\" width=\"96\" height=\"22\" rx=\"5\" fill=\"#EE7203\"><\u002Frect>\n          <rect x=\"770\" y=\"316\" width=\"72\" height=\"22\" rx=\"5\" fill=\"#EE7203\"><\u002Frect>\n          <rect x=\"770\" y=\"364\" width=\"44\" height=\"22\" rx=\"5\" fill=\"#FDE9D3\"><\u002Frect>\n          <text x=\"675\" y=\"490\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">light · the ladder<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Electrons choose\" data-speaker-notes=\"Part III, the punchline. Fire electrons — solid particles, tiny tennis balls — at the two slits. You would bet on two strips. But the screen builds the LADDER, dot by dot: each electron lands as a single definite dot, yet the dots pile up in a wave's interference pattern — even sending them one at a time. Weirder still: put a detector at the slits to see which slit each electron takes, and the ladder collapses back into the two strips. Watching changes the answer. Definite trajectories are gone; what remains are probabilities of where the next dot lands. Our cue: if nature offers only statistics down here, take the statistics seriously — just statistics, at first. That sentence is the door into arch I.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>PROLOGUE · 4 — THE NEW RULEBOOK<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Electrons build the ladder — until you watch<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>Now fire <\u002Fspan><strong>electrons<\u002Fstrong><span> — solid particles, tiny tennis balls. You'd bet on two strips. But the screen builds <\u002Fspan><strong>the ladder<\u002Fstrong><span>, dot by dot — each electron lands as one definite dot, yet the dots pile up in a wave's pattern. Even one at a time.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Weirder: place a detector at the slits to see <\u002Fspan><em>which slit<\u002Fem><span> each electron takes — and the ladder collapses into the two strips. <\u002Fspan><strong>Watching changes the answer.<\u002Fstrong><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>Definite paths are gone; what remains are <\u002Fspan><em>probabilities<\u002Fem><span> of the next dot. So take the statistics seriously — <\u002Fspan><strong>just statistics, at first.<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:30px;\">\n        <svg sc-camel-view-box=\"0 0 900 540\" style=\"width:100%; display:block;\">\n          <rect x=\"150\" y=\"60\" width=\"12\" height=\"120\" fill=\"#002157\"><\u002Frect>\n          <rect x=\"150\" y=\"212\" width=\"12\" height=\"66\" fill=\"#002157\"><\u002Frect>\n          <rect x=\"150\" y=\"310\" width=\"12\" height=\"120\" fill=\"#002157\"><\u002Frect>\n          <rect x=\"330\" y=\"60\" width=\"12\" height=\"370\" fill=\"#002157\"><\u002Frect>\n          <circle cx=\"309\" cy=\"88\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"298\" cy=\"102\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle>\n          <circle cx=\"304\" cy=\"134\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"294\" cy=\"146\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"312\" cy=\"152\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"300\" cy=\"162\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle>\n          <circle cx=\"296\" cy=\"196\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"308\" cy=\"204\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"290\" cy=\"214\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"302\" cy=\"222\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"312\" cy=\"232\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle>\n          <circle cx=\"292\" cy=\"252\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"304\" cy=\"258\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"296\" cy=\"270\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"310\" cy=\"276\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"300\" cy=\"284\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle>\n          <circle cx=\"306\" cy=\"318\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"294\" cy=\"328\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"310\" cy=\"338\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"298\" cy=\"346\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle>\n          <circle cx=\"302\" cy=\"382\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle><circle cx=\"292\" cy=\"396\" r=\"5\" fill=\"#EE7203\"><\u002Fcircle>\n          <text x=\"240\" y=\"490\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">unwatched · the ladder<\u002Ftext>\n          <rect x=\"560\" y=\"60\" width=\"12\" height=\"120\" fill=\"#002157\"><\u002Frect>\n          <rect x=\"560\" y=\"212\" width=\"12\" height=\"66\" fill=\"#002157\"><\u002Frect>\n          <rect x=\"560\" y=\"310\" width=\"12\" height=\"120\" fill=\"#002157\"><\u002Frect>\n          <circle cx=\"566\" cy=\"196\" r=\"15\" fill=\"none\" stroke=\"#F71D25\" stroke-width=\"3\"><\u002Fcircle>\n          <circle cx=\"566\" cy=\"196\" r=\"5\" fill=\"#F71D25\"><\u002Fcircle>\n          <text x=\"566\" y=\"152\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#F71D25\">detector<\u002Ftext>\n          <rect x=\"740\" y=\"60\" width=\"12\" height=\"370\" fill=\"#002157\"><\u002Frect>\n          <circle cx=\"712\" cy=\"172\" r=\"5\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"700\" cy=\"188\" r=\"5\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"716\" cy=\"200\" r=\"5\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"704\" cy=\"216\" r=\"5\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"714\" cy=\"232\" r=\"5\" fill=\"#00A1E4\"><\u002Fcircle>\n          <circle cx=\"708\" cy=\"288\" r=\"5\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"718\" cy=\"304\" r=\"5\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"702\" cy=\"316\" r=\"5\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"712\" cy=\"332\" r=\"5\" fill=\"#00A1E4\"><\u002Fcircle><circle cx=\"703\" cy=\"348\" r=\"5\" fill=\"#00A1E4\"><\u002Fcircle>\n          <text x=\"660\" y=\"490\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">watched · two strips<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Just statistics\" data-speaker-notes=\"The bridge into arch I. The usual story says quantum is NOT statistics — it runs on mysterious new numbers, the amplitudes. Our narrative agrees quantum is about amplitudes, but claims they are nothing mysterious: just statistics without the details thrown away. The tutorial's creed: quantum is not statistics plus magic — it is statistics with the details kept. Ordinary statistics is in the habit of throwing details away: it keeps one number for a coin and forgets where the uncertainty came from, whether it can be learned away, which recipe produced a belief. Arch I simply refuses to forget. Keep those details and the space of states grows by itself — from two dots, to an interval, to a circle, to a ball. That richer data structure is exactly where the electron's wave behavior lives. Nothing will be added along the way — only detail kept.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>PROLOGUE · 5 — THE ROAD AHEAD<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Not statistics plus magic — statistics with the details kept<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>The usual story: quantum is <\u002Fspan><em>not<\u002Fem><span> statistics but runs on mysterious new numbers, the <\u002Fspan><strong>amplitudes<\u002Fstrong><span>.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Our narrative: quantum <\u002Fspan><em>is<\u002Fem><span> about those amplitudes — but they are just statistics <\u002Fspan><strong>without the details thrown away<\u002Fstrong><span>. Track where the uncertainty came from, and whether it can be learned away.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Arch I simply <\u002Fspan><strong>refuses to forget<\u002Fstrong><span>. Keep the details, and the space of states grows by itself.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>Nothing quantum will be added along the way — only detail kept. Watch the structure grow.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:30px;\">\n        <svg sc-camel-view-box=\"0 0 900 520\" style=\"width:100%; display:block;\">\n          <circle cx=\"130\" cy=\"260\" r=\"14\" fill=\"#002157\"><\u002Fcircle>\n          <circle cx=\"190\" cy=\"260\" r=\"14\" fill=\"#EE7203\"><\u002Fcircle>\n          <text x=\"160\" y=\"330\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">a bit<\u002Ftext>\n          <text x=\"265\" y=\"268\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"36\" fill=\"#5C6E8F\">→<\u002Ftext>\n          <line x1=\"330\" y1=\"260\" x2=\"470\" y2=\"260\" stroke=\"#002157\" stroke-width=\"5\"><\u002Fline>\n          <circle cx=\"428\" cy=\"260\" r=\"10\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fcircle>\n          <text x=\"400\" y=\"330\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">an interval<\u002Ftext>\n          <text x=\"520\" y=\"268\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"36\" fill=\"#5C6E8F\">→<\u002Ftext>\n          <circle cx=\"630\" cy=\"260\" r=\"62\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"4\" stroke-dasharray=\"8 7\"><\u002Fcircle>\n          <text x=\"630\" y=\"366\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">a circle<\u002Ftext>\n          <text x=\"722\" y=\"268\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"36\" fill=\"#5C6E8F\">→<\u002Ftext>\n          <defs>\n            <radialGradient id=\"prologball\" cx=\"0.36\" cy=\"0.3\" r=\"0.95\">\n              <stop offset=\"0%\" stop-color=\"#FFFFFF\"><\u002Fstop>\n              <stop offset=\"60%\" stop-color=\"#CFEAF9\"><\u002Fstop>\n              <stop offset=\"100%\" stop-color=\"#AFD9F2\"><\u002Fstop>\n            <\u002FradialGradient>\n          <\u002Fdefs>\n          <circle cx=\"820\" cy=\"260\" r=\"62\" fill=\"url(#prologball)\" stroke=\"#AFE0F7\" stroke-width=\"2.5\"><\u002Fcircle>\n          <ellipse cx=\"820\" cy=\"260\" rx=\"62\" ry=\"17\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"3\" stroke-dasharray=\"6 5\"><\u002Fellipse>\n          <text x=\"820\" y=\"366\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">a ball<\u002Ftext>\n          <text x=\"450\" y=\"460\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#002157\">every arrow: a detail kept, not magic added<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Arch I divider\" data-speaker-notes=\"Arch one starts fully classical — a coin flip — and ends at the full qubit: disk, dial and ball. The driving idea: not all uncertainty is alike, and taking that seriously forces a bigger space of states.\" style=\"display:flex; flex-direction:column; align-items:center; justify-content:center; gap:32px; background:#002157; background-image:repeating-linear-gradient(to right, rgba(255,255,255,0.05) 0 1.5px, transparent 1.5px 48px), repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0 1.5px, transparent 1.5px 48px); color:#FFFFFF; font-family:'Fraunces', Georgia, serif; box-sizing:border-box; padding:100px;\">\n    <div style=\"font-family:'IBM Plex Mono', monospace; font-size:26px; letter-spacing:4px; color:#EE7203; font-weight:600;\"><span>ARCH I<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-size:88px; font-weight:700; margin:0; letter-spacing:-1.5px; text-align:center;\"><span>Not all uncertainty is alike<\u002Fspan><\u002Fh2>\n    <p style=\"font-family:'IBM Plex Mono', monospace; font-size:28px; color:#AFE0F7; margin:0; text-align:center;\"><span>starts statistical · ends at the qubit, ball and all<\u002Fspan><\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"From certainty to chance\" data-speaker-notes=\"Classical measurement reports a definite fact: heads or tails, never both. At small scales the honest statement before looking is a bet: heads with probability p. Every belief becomes one point on the interval from 0 to 1.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>I · 1 — FROM CERTAINTY TO CHANCE<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Definite answers give way to bets<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:80px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:30px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>In the classical world every answer is definite: heads or tails, one or the other, never both. Measuring reports a fact that was already there.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Zoom in far enough and certainty crumbles. Before you look, the honest statement is a bet: heads with probability <\u002Fspan><strong>p<\u002Fstrong><span>, tails with the rest.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>Every belief about the coin becomes one point on the interval [0, 1].<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:30px;\">\n        <svg sc-camel-view-box=\"0 0 900 460\" style=\"width:100%; display:block;\">\n          <circle cx=\"330\" cy=\"120\" r=\"72\" fill=\"#FFFFFF\" stroke=\"#AFE0F7\" stroke-width=\"4\"><\u002Fcircle>\n          <text x=\"330\" y=\"142\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"60\" font-weight=\"600\" fill=\"#002157\">T<\u002Ftext>\n          <circle cx=\"570\" cy=\"120\" r=\"72\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"4\"><\u002Fcircle>\n          <text x=\"570\" y=\"142\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"60\" font-weight=\"600\" fill=\"#FFFFFF\">H<\u002Ftext>\n          <text x=\"450\" y=\"135\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"32\" fill=\"#5C6E8F\">or<\u002Ftext>\n          <line x1=\"100\" y1=\"330\" x2=\"800\" y2=\"330\" stroke=\"#002157\" stroke-width=\"4\"><\u002Fline>\n          <line x1=\"100\" y1=\"314\" x2=\"100\" y2=\"346\" stroke=\"#002157\" stroke-width=\"4\"><\u002Fline>\n          <line x1=\"800\" y1=\"314\" x2=\"800\" y2=\"346\" stroke=\"#002157\" stroke-width=\"4\"><\u002Fline>\n          <line x1=\"450\" y1=\"318\" x2=\"450\" y2=\"342\" stroke=\"#5C6E8F\" stroke-width=\"3\"><\u002Fline>\n          <circle cx=\"590\" cy=\"330\" r=\"13\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"590\" y=\"288\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#EE7203\">your coin · p = 0.7<\u002Ftext>\n          <text x=\"60\" y=\"390\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#5C6E8F\">0 · always tails<\u002Ftext>\n          <text x=\"450\" y=\"390\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#5C6E8F\">½<\u002Ftext>\n          <text x=\"840\" y=\"390\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#5C6E8F\">1 · always heads<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Two uncertainties\" data-speaker-notes=\"Key distinction. Fair coin: randomness lives in the coin, flips never remove it — statistical. Mystery deterministic coin: already decided, one peek cures your ignorance — systematic. Before the first flip both are 50/50: on the interval they collapse to the same point. One number cannot tell them apart.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>I · 2 — TWO KINDS OF NOT-KNOWING<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>One number hides where the uncertainty comes from<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:50px; margin-top:56px;\">\n      <div style=\"flex:1; border:2px solid #00A1E4; border-radius:14px; padding:44px 48px; display:flex; flex-direction:column; gap:22px;\">\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:2px; color:#00A1E4; font-weight:600;\"><span>THE FAIR COIN<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0; font-size:29px; line-height:1.5;\"><span>Genuinely random. Every flip is fresh chance — flip it forever and the 50/50 never budges.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; font-size:29px; line-height:1.5; color:#5C6E8F;\"><strong style=\"color:#002157;\">Statistical uncertainty<\u002Fstrong><span> — it is there to stay.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; border:2px solid #F71D25; border-radius:14px; padding:44px 48px; display:flex; flex-direction:column; gap:22px;\">\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:2px; color:#F71D25; font-weight:600;\"><span>THE MYSTERY COIN<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0; font-size:29px; line-height:1.5;\"><span>Always lands the same side — you just don't know which. One peek and you know everything.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; font-size:29px; line-height:1.5; color:#5C6E8F;\"><strong style=\"color:#002157;\">Systematic uncertainty<\u002Fstrong><span> — you can learn it away.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:52px; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); padding:24px 40px; display:flex; align-items:center; gap:50px;\">\n      <svg sc-camel-view-box=\"0 0 900 200\" style=\"width:56%; display:block;\">\n        <line x1=\"100\" y1=\"130\" x2=\"800\" y2=\"130\" stroke=\"#002157\" stroke-width=\"4\"><\u002Fline>\n        <line x1=\"100\" y1=\"114\" x2=\"100\" y2=\"146\" stroke=\"#002157\" stroke-width=\"4\"><\u002Fline>\n        <line x1=\"800\" y1=\"114\" x2=\"800\" y2=\"146\" stroke=\"#002157\" stroke-width=\"4\"><\u002Fline>\n        <circle cx=\"450\" cy=\"130\" r=\"14\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n        <line x1=\"360\" y1=\"66\" x2=\"437\" y2=\"120\" stroke=\"#00A1E4\" stroke-width=\"3\"><\u002Fline>\n        <line x1=\"540\" y1=\"66\" x2=\"463\" y2=\"120\" stroke=\"#F71D25\" stroke-width=\"3\"><\u002Fline>\n        <text x=\"345\" y=\"48\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#00A1E4\">fair coin<\u002Ftext>\n        <text x=\"560\" y=\"48\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#F71D25\">mystery coin<\u002Ftext>\n        <text x=\"450\" y=\"184\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#5C6E8F\">both sit at exactly ½<\u002Ftext>\n      <\u002Fsvg>\n      <p style=\"margin:0; flex:1; font-size:30px; line-height:1.5;\"><span>Before the first flip, both coins are 50/50. On the interval they are the <\u002Fspan><em>same point<\u002Fem><span> — one number cannot tell wisdom-to-come from permanent chance.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Semicircle and half-disk\" data-speaker-notes=\"Fix: score every coin with two numbers — average and spread. Definite coins land on an arc, the upper half of the Bernoulli circle; the fair coin at the top, the averaged mystery coin at the center. Blends of candidates slide along chords and fill the whole half-disk: rim = chance that stays, interior = doubt you can learn away.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>I · 3 — THE BERNOULLI CIRCLE<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>A second number opens the half-disk<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>Give every coin two scores: its <\u002Fspan><strong>average<\u002Fstrong><span> outcome, and its <\u002Fspan><strong>spread<\u002Fstrong><span> — how much its flips wobble.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Coins you know exactly land on one arc — the upper half of the <\u002Fspan><em>Bernoulli circle<\u002Fem><span>. The fair coin at the top; the averaged mystery coin at the center, finally separated.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>Not sure which coin you hold? Blends slide along straight lines and fill the <\u002Fspan><em>whole half-disk<\u002Fem><span>: rim — chance that stays; interior — doubt you can learn away.<\u002Fspan><\u002Fp>\n        <sc-if value=\"{{ showFormulas }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"align-self:flex-start; font-family:'IBM Plex Mono', monospace; font-size:25px; padding:14px 24px; border:1.5px solid #AFE0F7; border-radius:8px; background:#FFF4E8;\"><span>spread = √(p(1−p)) → a circle of radius ½<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 520\" style=\"width:100%; display:block;\">\n          <path d=\"M 150 430 A 300 300 0 0 1 750 430 Z\" fill=\"#FDE9D3\" fill-opacity=\"0.5\"><\u002Fpath>\n          <line x1=\"90\" y1=\"430\" x2=\"810\" y2=\"430\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fline>\n          <path d=\"M 150 430 A 300 300 0 0 1 750 430\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"5\" stroke-dasharray=\"10 9\"><\u002Fpath>\n          <line x1=\"690\" y1=\"250\" x2=\"240\" y2=\"216\" stroke=\"#5C6E8F\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\"><\u002Fline>\n          <circle cx=\"488\" cy=\"235\" r=\"10\" fill=\"#FFFFFF\" stroke=\"#5C6E8F\" stroke-width=\"3\"><\u002Fcircle>\n          <circle cx=\"150\" cy=\"430\" r=\"9\" fill=\"#002157\"><\u002Fcircle>\n          <circle cx=\"750\" cy=\"430\" r=\"9\" fill=\"#002157\"><\u002Fcircle>\n          <circle cx=\"450\" cy=\"130\" r=\"11\" fill=\"#00A1E4\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <circle cx=\"450\" cy=\"430\" r=\"11\" fill=\"#F71D25\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"150\" y=\"474\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">always T<\u002Ftext>\n          <text x=\"750\" y=\"474\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">always H<\u002Ftext>\n          <text x=\"450\" y=\"98\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#00A1E4\">fair coin (½, ½)<\u002Ftext>\n          <text x=\"450\" y=\"480\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#F71D25\">mystery coin (½, 0)<\u002Ftext>\n          <text x=\"466\" y=\"212\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">a blend<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Thales lift\" data-speaker-notes=\"Two school theorems hiding in the picture. Pick any belief on the semicircle and connect it to the two corners. Thales: a diameter is always seen at a right angle — the two chords are perpendicular. Their lengths are exactly √p and √(1−p). Pythagoras: legs squared add to the hypotenuse squared, and T–H has length 1 — so p + (1−p) = 1. The coin's arithmetic is literally a right triangle. Use the two lengths as coordinates of their own and the pair (√p, √(1−p)) lives on the unit circle: the amplitudes, at angle α. Nothing invented — the unit circle appears when you measure each state's two distances. Key parameterization: the Bernoulli point sits at angle 2α, so one lap on the unit circle walks the Bernoulli circle twice — a double cover. Two amplitude points per belief: the hidden twin of the next slide is already waiting. This square-root embedding, chord to arc, returns throughout the deck.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>I · 4 — TWO SCHOOL THEOREMS<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Thales and Pythagoras hide inside the coin<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>Pick any belief on the arc and connect it to the two corners. <\u002Fspan><strong>Thales<\u002Fstrong><span>: a diameter is always seen at a right angle — the two chords are perpendicular.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Their lengths are exactly <\u002Fspan><strong>√p<\u002Fstrong><span> and <\u002Fspan><strong>√(1−p)<\u002Fstrong><span>. <\u002Fspan><strong>Pythagoras<\u002Fstrong><span> finishes it: legs squared add to the hypotenuse squared — and T–H has length 1, so p + (1−p) = 1.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>The coin's arithmetic is literally a right triangle.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>Use the two lengths as coordinates of their own: (√p, √(1−p)) lives on the unit circle — the <\u002Fspan><em>amplitudes<\u002Fem><span>, at some angle α.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 560\" style=\"width:96%; display:block;\">\n          <line x1=\"110\" y1=\"470\" x2=\"790\" y2=\"470\" stroke=\"#002157\" stroke-width=\"4\"><\u002Fline>\n          <path d=\"M 170 470 A 280 280 0 0 1 730 470\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"4\" stroke-dasharray=\"10 9\"><\u002Fpath>\n          <line x1=\"170\" y1=\"470\" x2=\"562\" y2=\"213\" stroke=\"#00A1E4\" stroke-width=\"4\"><\u002Fline>\n          <line x1=\"730\" y1=\"470\" x2=\"562\" y2=\"213\" stroke=\"#EE7203\" stroke-width=\"4\"><\u002Fline>\n          <polyline points=\"536.9,229.4 553.3,254.5 578.4,238.1\" fill=\"none\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fpolyline>\n          <circle cx=\"170\" cy=\"470\" r=\"10\" fill=\"#002157\"><\u002Fcircle>\n          <circle cx=\"730\" cy=\"470\" r=\"10\" fill=\"#002157\"><\u002Fcircle>\n          <circle cx=\"562\" cy=\"213\" r=\"12\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"562\" y=\"170\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#002157\">your belief<\u002Ftext>\n          <text x=\"170\" y=\"516\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#5C6E8F\">T<\u002Ftext>\n          <text x=\"730\" y=\"516\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#5C6E8F\">H<\u002Ftext>\n          <text x=\"341\" y=\"304\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#00A1E4\" transform=\"rotate(-33 341 304)\">length √p<\u002Ftext>\n          <text x=\"715\" y=\"296\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#EE7203\" transform=\"rotate(57 715 296)\">length √(1−p)<\u002Ftext>\n          <text x=\"450\" y=\"446\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#5C6E8F\">the diameter T–H · length 1<\u002Ftext>\n          <text x=\"450\" y=\"550\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#002157\">p + (1−p) = 1 — Pythagoras, on a coin<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Square-root embedding\" data-speaker-notes=\"The lift is a map, not just a picture: p goes to the amplitude pair (√p, √(1−p)) — the square-root embedding. Sweep the angle α once around the unit circle and watch the coin: the Bernoulli point runs around its circle TWICE — the Bernoulli angle is 2α. The first quarter of the unit circle, where both amplitudes are honest positive square roots, already covers every coin once. So the amplitude circle is a finer dial than the coin it describes: two amplitude points, α and −α, sit over each coin. Hold that — the next slide finds the second one.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>I · 5 — THE SQUARE-ROOT EMBEDDING<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>One turn of the dial, two laps of the coin<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>The lift is a map: send every coin p to its amplitude pair <\u002Fspan><strong>(√p, √(1−p))<\u002Fstrong><span> on the unit circle — the <\u002Fspan><em>square-root embedding<\u002Fem><span>.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Now sweep the angle α once around the unit circle and watch the coin: its Bernoulli point runs around <\u002Fspan><strong>twice<\u002Fstrong><span> — the Bernoulli angle is <\u002Fspan><strong>2α<\u002Fstrong><span>.<\u002Fspan><\u002Fp>\n        <sc-if value=\"{{ showFormulas }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"align-self:flex-start; font-family:'IBM Plex Mono', monospace; font-size:25px; padding:14px 24px; border:1.5px solid #AFE0F7; border-radius:8px; background:#FFF4E8;\"><span style=\"white-space:nowrap;\">amplitude angle α → Bernoulli angle 2α<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>The first quarter-turn already covers every coin once. Every belief owns <\u002Fspan><em>two<\u002Fem><span> amplitude points, α and −α — the twin is already waiting.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 596\" style=\"width:96%; display:block;\">\n          <line x1=\"180\" y1=\"300\" x2=\"720\" y2=\"300\" stroke=\"#5C6E8F\" stroke-width=\"2\" stroke-dasharray=\"4 5\"><\u002Fline>\n          <circle cx=\"450\" cy=\"300\" r=\"230\" fill=\"none\" stroke=\"#00A1E4\" stroke-width=\"4\"><\u002Fcircle>\n          <circle cx=\"565\" cy=\"300\" r=\"115\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"4\" stroke-dasharray=\"9 8\"><\u002Fcircle>\n          <line x1=\"450\" y1=\"300\" x2=\"638.4\" y2=\"168.1\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fline>\n          <line x1=\"565\" y1=\"300\" x2=\"604.3\" y2=\"191.9\" stroke=\"#EE7203\" stroke-width=\"3\"><\u002Fline>\n          <path d=\"M 505 300 A 55 55 0 0 0 495.1 268.5\" fill=\"none\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fpath>\n          <text x=\"528\" y=\"284\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#002157\">α<\u002Ftext>\n          <path d=\"M 613 300 A 48 48 0 0 0 581.4 254.9\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"2.5\"><\u002Fpath>\n          <text x=\"627\" y=\"278\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#EE7203\">2α<\u002Ftext>\n          <circle cx=\"450\" cy=\"300\" r=\"9\" fill=\"#002157\"><\u002Fcircle>\n          <circle cx=\"680\" cy=\"300\" r=\"9\" fill=\"#002157\"><\u002Fcircle>\n          <text x=\"434\" y=\"338\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">0<\u002Ftext>\n          <text x=\"692\" y=\"338\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">1<\u002Ftext>\n          <circle cx=\"638.4\" cy=\"168.1\" r=\"11\" fill=\"#00A1E4\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"664\" y=\"158\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#00A1E4\">(a, b)<\u002Ftext>\n          <circle cx=\"604.3\" cy=\"191.9\" r=\"11\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"556\" y=\"160\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#EE7203\">(p, σ)<\u002Ftext>\n          <text x=\"326\" y=\"94\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#00A1E4\">unit circle<\u002Ftext>\n          <text x=\"480\" y=\"458\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#EE7203\">Bernoulli circle<\u002Ftext>\n          <text x=\"450\" y=\"582\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">one ray does both: inscribed angle α at 0 → central angle 2α<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Twin and full disk\" data-speaker-notes=\"A half-circle is half of something. Mirror any point below the line: identical odds, no flip separates them — but the triangle T-state-H circles one way above, the other way below. Keep orientation and the twins are distinct: the full circle, the full disk. This is exactly the real slice of a qubit's state space. Epilogue framing: our instrument, the bare flip, is blind by symmetry to the lower half — classical probability contents itself with the upper half-disk; nature is more INCLUSIVE: same lengths, opposite turning count for her as two different states.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>I · 6 — THE HIDDEN TWIN<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Orientation completes the circle — the real part of a qubit<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>Mirror any point P below the line: the twin P′ gives <\u002Fspan><strong>exactly the same odds<\u002Fstrong><span>. No coin flip will ever tell them apart.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>But the triangle T–state–H circles <\u002Fspan><em>one way<\u002Fem><span> above the line and <\u002Fspan><em>the other way<\u002Fem><span> below. Same lengths, opposite <\u002Fspan><strong>orientation<\u002Fstrong><span>.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Keep the orientation and the twins become distinct: the full circle, and with blends the full disk.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>This disk <\u002Fspan><em>is<\u002Fem><span> the real slice of a qubit — one dial short of the full thing.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 600\" style=\"width:96%; display:block;\">\n          <line x1=\"140\" y1=\"300\" x2=\"760\" y2=\"300\" stroke=\"#5C6E8F\" stroke-width=\"2.5\" stroke-dasharray=\"6 6\"><\u002Fline>\n          <path d=\"M 220 300 A 230 230 0 0 1 680 300\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"4.5\" stroke-dasharray=\"9 8\"><\u002Fpath>\n          <path d=\"M 220 300 A 230 230 0 0 0 680 300\" fill=\"none\" stroke=\"#F71D25\" stroke-width=\"4.5\" stroke-dasharray=\"9 8\"><\u002Fpath>\n          <line x1=\"220\" y1=\"300\" x2=\"598\" y2=\"124\" stroke=\"#EE7203\" stroke-width=\"3\"><\u002Fline>\n          <line x1=\"680\" y1=\"300\" x2=\"598\" y2=\"124\" stroke=\"#00A1E4\" stroke-width=\"3\"><\u002Fline>\n          <line x1=\"220\" y1=\"300\" x2=\"598\" y2=\"476\" stroke=\"#EE7203\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\"><\u002Fline>\n          <line x1=\"680\" y1=\"300\" x2=\"598\" y2=\"476\" stroke=\"#00A1E4\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\"><\u002Fline>\n          <text x=\"499\" y=\"256\" text-anchor=\"middle\" font-size=\"46\" fill=\"#EE7203\">↺<\u002Ftext>\n          <text x=\"499\" y=\"386\" text-anchor=\"middle\" font-size=\"46\" fill=\"#F71D25\">↻<\u002Ftext>\n          <circle cx=\"220\" cy=\"300\" r=\"9\" fill=\"#002157\"><\u002Fcircle>\n          <circle cx=\"680\" cy=\"300\" r=\"9\" fill=\"#002157\"><\u002Fcircle>\n          <text x=\"196\" y=\"342\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">T<\u002Ftext>\n          <text x=\"704\" y=\"342\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">H<\u002Ftext>\n          <circle cx=\"598\" cy=\"124\" r=\"11\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <circle cx=\"598\" cy=\"476\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"630\" y=\"112\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#002157\">P<\u002Ftext>\n          <text x=\"622\" y=\"524\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#002157\">P′ · the twin<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The complex dial\" data-speaker-notes=\"The twin was a two-position switch: above or below the line. Nature upgrades the switch to a continuous dial phi: at every set of odds a whole wheel of twins stands upright on the T-H axle, and the disk inflates into the Bloch ball — the full state space of a qubit. Definite states on the surface, mixed beliefs inside, total ignorance at the center. Arch I gave the real slice; the dial fills in the rest.\" style=\"display:flex; flex-direction:column; padding:
