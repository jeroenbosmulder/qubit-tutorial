90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>I · 7 — THE COMPLEX DIAL<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>The switch becomes a dial, the disk becomes a ball<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>The twin was a two-position switch: above or below the line.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Nature upgrades it to a <\u002Fspan><strong>continuous dial φ<\u002Fstrong><span>: at every set of odds, a whole wheel of twins stands upright on the T–H axle.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>The disk inflates into the <\u002Fspan><em>Bloch ball<\u002Fem><span> — the complete state space of a qubit. Definite states on the surface, mixed beliefs inside, total ignorance at the center.<\u002Fspan><\u002Fp>\n        <sc-if value=\"{{ showFormulas }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"align-self:flex-start; font-family:'IBM Plex Mono', monospace; font-size:25px; padding:14px 24px; border:1.5px solid #AFE0F7; border-radius:8px; background:#FFF4E8;\"><span>the sign ± grows into an angle φ ∈ [0°, 360°)<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 620\" style=\"width:96%; display:block;\">\n          <defs>\n            <radialGradient id=\"ballshade\" cx=\"0.36\" cy=\"0.3\" r=\"0.95\">\n              <stop offset=\"0%\" stop-color=\"#FFFFFF\"><\u002Fstop>\n              <stop offset=\"45%\" stop-color=\"#EDF7FD\"><\u002Fstop>\n              <stop offset=\"80%\" stop-color=\"#CFEAF9\"><\u002Fstop>\n              <stop offset=\"100%\" stop-color=\"#AFD9F2\"><\u002Fstop>\n            <\u002FradialGradient>\n          <\u002Fdefs>\n          <circle cx=\"450\" cy=\"300\" r=\"240\" fill=\"url(#ballshade)\" stroke=\"#AFE0F7\" stroke-width=\"2.5\"><\u002Fcircle>\n          <ellipse cx=\"450\" cy=\"300\" rx=\"240\" ry=\"62\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"3\" stroke-dasharray=\"9 8\"><\u002Fellipse>\n          <line x1=\"210\" y1=\"300\" x2=\"690\" y2=\"300\" stroke=\"#5C6E8F\" stroke-width=\"2\" stroke-dasharray=\"4 5\"><\u002Fline>\n          <ellipse cx=\"522\" cy=\"300\" rx=\"52\" ry=\"229\" fill=\"none\" stroke=\"#00A1E4\" stroke-width=\"3.5\"><\u002Fellipse>\n          <circle cx=\"210\" cy=\"300\" r=\"8\" fill=\"#002157\"><\u002Fcircle>\n          <circle cx=\"690\" cy=\"300\" r=\"8\" fill=\"#002157\"><\u002Fcircle>\n          <text x=\"185\" y=\"306\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#002157\">always T<\u002Ftext>\n          <text x=\"715\" y=\"306\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#002157\">always H<\u002Ftext>\n          <line x1=\"450\" y1=\"300\" x2=\"559\" y2=\"140\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fline>\n          <circle cx=\"559\" cy=\"140\" r=\"12\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"588\" y=\"130\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#002157\">state<\u002Ftext>\n          <text x=\"595\" y=\"62\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#00A1E4\">φ spins the wheel<\u002Ftext>\n          <text x=\"450\" y=\"586\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#EE7203\">gold: your Bernoulli circle, lying flat<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Rotate the question\" data-speaker-notes=\"A bit has one non-trivial move: swap. On the ball every diameter is an axis and every angle is allowed — and tilting a question is real hardware: rotate the whole system, then flip; that is all an interferometer or polarizer does. The plain flip is symmetric under the mirror so it never sees the twins; any tilted axle splits P from P-prime. These continuous rotations are the gates of a quantum computer.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>I · 8 — ROTATIONS<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>A bit swaps; a qubit rotates<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>A bit has exactly one non-trivial move: <\u002Fspan><strong>swap<\u002Fstrong><span> heads and tails. That is the whole toolbox.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>On the ball, <\u002Fspan><em>every diameter is an axis<\u002Fem><span>: rotate by any angle around any of them. Rotating tilts the question — and tilted axles finally <\u002Fspan><strong>see the twins<\u002Fstrong><span> the plain flip is blind to.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>This is real hardware, not fantasy: rotate the whole system, then flip — that is all an <\u002Fspan><strong>interferometer<\u002Fstrong><span> or a polarizer does.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>These continuous rotations are the <\u002Fspan><em>gates<\u002Fem><span> of a quantum computer: more information in the state, and more ways to steer it.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 560\" style=\"width:96%; display:block;\">\n          <defs>\n            <radialGradient id=\"opsball\" cx=\"0.36\" cy=\"0.3\" r=\"0.95\">\n              <stop offset=\"0%\" stop-color=\"#FFFFFF\"><\u002Fstop>\n              <stop offset=\"60%\" stop-color=\"#CFEAF9\"><\u002Fstop>\n              <stop offset=\"100%\" stop-color=\"#AFD9F2\"><\u002Fstop>\n            <\u002FradialGradient>\n          <\u002Fdefs>\n          <circle cx=\"170\" cy=\"270\" r=\"48\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"170\" y=\"286\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"42\" font-weight=\"600\" fill=\"#FFFFFF\">H<\u002Ftext>\n          <circle cx=\"300\" cy=\"270\" r=\"48\" fill=\"#FFFFFF\" stroke=\"#AFE0F7\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"300\" y=\"286\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"42\" font-weight=\"600\" fill=\"#002157\">T<\u002Ftext>\n          <text x=\"235\" y=\"185\" text-anchor=\"middle\" font-size=\"58\" fill=\"#5C6E8F\">⇄<\u002Ftext>\n          <text x=\"235\" y=\"420\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#5C6E8F\">the bit: swap — that's all<\u002Ftext>\n          <circle cx=\"620\" cy=\"270\" r=\"145\" fill=\"url(#opsball)\" stroke=\"#AFE0F7\" stroke-width=\"2.5\"><\u002Fcircle>\n          <ellipse cx=\"620\" cy=\"270\" rx=\"145\" ry=\"38\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"3\" stroke-dasharray=\"7 6\"><\u002Fellipse>\n          <ellipse cx=\"620\" cy=\"270\" rx=\"38\" ry=\"145\" fill=\"none\" stroke=\"#00A1E4\" stroke-width=\"3\" stroke-dasharray=\"7 6\"><\u002Fellipse>\n          <line x1=\"512\" y1=\"378\" x2=\"728\" y2=\"162\" stroke=\"#5C6E8F\" stroke-width=\"2.5\" stroke-dasharray=\"5 5\"><\u002Fline>\n          <text x=\"782\" y=\"286\" text-anchor=\"middle\" font-size=\"44\" fill=\"#EE7203\">↻<\u002Ftext>\n          <text x=\"620\" y=\"102\" text-anchor=\"middle\" font-size=\"44\" fill=\"#00A1E4\">↻<\u002Ftext>\n          <text x=\"754\" y=\"150\" text-anchor=\"middle\" font-size=\"40\" fill=\"#5C6E8F\">↻<\u002Ftext>\n          <text x=\"620\" y=\"470\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#002157\">the qubit: any axis, any angle<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Power of quantum\" data-speaker-notes=\"Close arch I with the payoff. The build-up: bit → interval → circle → ball. More information in the state, more ways to steer it — but the real power is the third point: nobody manufactures qubits from scratch. Electrons, photons, atoms ARE qubits — nature provides them in the wild; a quantum computer just tames them. That is why this data structure matters: it is not our invention, it is nature's native format.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>I · 9 — WHY IT MATTERS<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>A richer data structure — living in the wild<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; justify-content:center; gap:34px; margin-top:70px;\">\n      <div style=\"width:330px; display:flex; flex-direction:column; align-items:center; gap:20px; border:2px solid #AFE0F7; border-radius:14px; padding:34px 20px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px);\">\n        <svg sc-camel-view-box=\"0 0 200 160\" style=\"width:200px; display:block;\">\n          <circle cx=\"60\" cy=\"80\" r=\"15\" fill=\"#002157\"><\u002Fcircle>\n          <circle cx=\"140\" cy=\"80\" r=\"15\" fill=\"#EE7203\"><\u002Fcircle>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; color:#002157; text-align:center;\"><span>bit — two answers<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:44px; color:#5C6E8F;\"><span>→<\u002Fspan><\u002Fdiv>\n      <div style=\"width:330px; display:flex; flex-direction:column; align-items:center; gap:20px; border:2px solid #AFE0F7; border-radius:14px; padding:34px 20px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px);\">\n        <svg sc-camel-view-box=\"0 0 200 160\" style=\"width:200px; display:block;\">\n          <line x1=\"30\" y1=\"80\" x2=\"170\" y2=\"80\" stroke=\"#002157\" stroke-width=\"5\"><\u002Fline>\n          <circle cx=\"115\" cy=\"80\" r=\"11\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fcircle>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; color:#002157; text-align:center;\"><span>probability — an interval<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:44px; color:#5C6E8F;\"><span>→<\u002Fspan><\u002Fdiv>\n      <div style=\"width:330px; display:flex; flex-direction:column; align-items:center; gap:20px; border:2px solid #AFE0F7; border-radius:14px; padding:34px 20px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px);\">\n        <svg sc-camel-view-box=\"0 0 200 160\" style=\"width:200px; display:block;\">\n          <circle cx=\"100\" cy=\"80\" r=\"58\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"4\" stroke-dasharray=\"8 7\"><\u002Fcircle>\n          <circle cx=\"100\" cy=\"22\" r=\"9\" fill=\"#EE7203\"><\u002Fcircle>\n          <circle cx=\"100\" cy=\"138\" r=\"9\" fill=\"#FFFFFF\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fcircle>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; color:#002157; text-align:center;\"><span>a sign — the full circle<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:44px; color:#5C6E8F;\"><span>→<\u002Fspan><\u002Fdiv>\n      <div style=\"width:330px; display:flex; flex-direction:column; align-items:center; gap:20px; border:2px solid #EE7203; border-radius:14px; padding:34px 20px; background:#FFF4E8;\">\n        <svg sc-camel-view-box=\"0 0 200 160\" style=\"width:200px; display:block;\">\n          <defs>\n            <radialGradient id=\"miniball\" cx=\"0.36\" cy=\"0.3\" r=\"0.95\">\n              <stop offset=\"0%\" stop-color=\"#FFFFFF\"><\u002Fstop>\n              <stop offset=\"60%\" stop-color=\"#CFEAF9\"><\u002Fstop>\n              <stop offset=\"100%\" stop-color=\"#AFD9F2\"><\u002Fstop>\n            <\u002FradialGradient>\n          <\u002Fdefs>\n          <circle cx=\"100\" cy=\"80\" r=\"58\" fill=\"url(#miniball)\" stroke=\"#AFE0F7\" stroke-width=\"2.5\"><\u002Fcircle>\n          <ellipse cx=\"100\" cy=\"80\" rx=\"58\" ry=\"16\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"3\" stroke-dasharray=\"6 5\"><\u002Fellipse>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; font-weight:600; color:#002157; text-align:center;\"><span>a dial — the quantum ball<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:64px auto 0; max-width:1340px; font-size:32px; line-height:1.55; text-align:center;\"><span>More information in the state. More ways to steer it.<\u002Fspan><\u002Fp>\n    <p style=\"margin:10px auto 0; max-width:1340px; font-size:32px; line-height:1.55; text-align:center;\"><span>But the real power: <\u002Fspan><strong>these qubits live in the wild.<\u002Fstrong><\u002Fp>\n    <p style=\"margin:10px auto 0; max-width:1340px; font-size:32px; line-height:1.55; text-align:center;\"><span>Electrons, photons, atoms <\u002Fspan><em>are<\u002Fem><span> qubits — nature provides them; we only need to tame them.<\u002Fspan><\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Arch II divider\" data-speaker-notes=\"Arch two starts with a purely statistical question — how far apart are two coins? — and its honest answer will hand us, unasked, the exact distance quantum information theory uses today.\" style=\"display:flex; flex-direction:column; align-items:center; justify-content:center; gap:32px; background:#002157; background-image:repeating-linear-gradient(to right, rgba(255,255,255,0.05) 0 1.5px, transparent 1.5px 48px), repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0 1.5px, transparent 1.5px 48px); color:#FFFFFF; font-family:'Fraunces', Georgia, serif; box-sizing:border-box; padding:100px;\">\n    <div style=\"font-family:'IBM Plex Mono', monospace; font-size:26px; letter-spacing:4px; color:#EE7203; font-weight:600;\"><span>ARCH II<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-size:88px; font-weight:700; margin:0; letter-spacing:-1.5px; text-align:center;\"><span>How far apart are two coins?<\u002Fspan><\u002Fh2>\n    <p style=\"font-family:'IBM Plex Mono', monospace; font-size:28px; color:#AFE0F7; margin:0; text-align:center;\"><span>starts statistical · ends at the ruler of quantum information<\u002Fspan><\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"The flat ruler lies\" data-speaker-notes=\"Natural first answer: distance = gap on the interval. Test it: a 0.50-coin vs a 0.60-coin, and a 0.00-coin vs a 0.10-coin — the same gap of 0.10. But telling the first pair apart takes about 140 flips; the second pair, about 20 — one head from the 0.10-coin ends the game. Same ruler-gap, tenfold difference in real cost. The flat ruler lies.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>II · 1 — A NATURAL ANSWER, TESTED<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>The flat ruler lies about distance<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>Obvious answer: the gap on the interval. Let's test it with two duels, each a gap of exactly <\u002Fspan><strong>0.10<\u002Fstrong><span>.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><strong style=\"color:#00A1E4;\">Duel A<\u002Fstrong><span> — a 0.50-coin vs a 0.60-coin: you need roughly <\u002Fspan><strong>140 flips<\u002Fstrong><span> to name the coin with confidence.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><strong style=\"color:#EE7203;\">Duel B<\u002Fstrong><span> — a 0.00-coin vs a 0.10-coin: roughly <\u002Fspan><strong>20 flips<\u002Fstrong><span> — a single head settles it.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>Same gap, tenfold difference in real cost. Distance should measure <\u002Fspan><em>how hard it is to tell apart<\u002Fem><span> — and the flat ruler gets it wrong.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:30px;\">\n        <svg sc-camel-view-box=\"0 0 900 460\" style=\"width:100%; display:block;\">\n          <line x1=\"100\" y1=\"200\" x2=\"800\" y2=\"200\" stroke=\"#002157\" stroke-width=\"4\"><\u002Fline>\n          <line x1=\"100\" y1=\"184\" x2=\"100\" y2=\"216\" stroke=\"#002157\" stroke-width=\"4\"><\u002Fline>\n          <line x1=\"800\" y1=\"184\" x2=\"800\" y2=\"216\" stroke=\"#002157\" stroke-width=\"4\"><\u002Fline>\n          <line x1=\"450\" y1=\"200\" x2=\"520\" y2=\"200\" stroke=\"#00A1E4\" stroke-width=\"10\" stroke-linecap=\"round\"><\u002Fline>\n          <line x1=\"100\" y1=\"200\" x2=\"170\" y2=\"200\" stroke=\"#EE7203\" stroke-width=\"10\" stroke-linecap=\"round\"><\u002Fline>\n          <circle cx=\"450\" cy=\"200\" r=\"10\" fill=\"#FFFFFF\" stroke=\"#00A1E4\" stroke-width=\"4\"><\u002Fcircle>\n          <circle cx=\"520\" cy=\"200\" r=\"10\" fill=\"#00A1E4\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <circle cx=\"100\" cy=\"200\" r=\"10\" fill=\"#FFFFFF\" stroke=\"#EE7203\" stroke-width=\"4\"><\u002Fcircle>\n          <circle cx=\"170\" cy=\"200\" r=\"10\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"485\" y=\"118\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#00A1E4\">duel A · 0.50 vs 0.60<\u002Ftext>\n          <text x=\"180\" y=\"266\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#EE7203\">duel B · 0.00 vs 0.10<\u002Ftext>\n          <text x=\"485\" y=\"158\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"27\" font-weight=\"600\" fill=\"#00A1E4\">≈ 140 flips<\u002Ftext>\n          <text x=\"347\" y=\"304\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"27\" font-weight=\"600\" fill=\"#EE7203\">≈ 20 flips<\u002Ftext>\n          <text x=\"450\" y=\"410\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#F71D25\">same gap · ×10 the effort<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Walk the arc\" data-speaker-notes=\"The cure arch I already built: lift each coin to its place on the Bernoulli circle and walk the arc between them, not the chord below. Near the edges the arc stretches — exactly where flips are most telling. This arc has a classical name: the Bhattacharyya angle. And it is the honest ruler: the number of flips you need grows as one over the arc squared. Equal arcs cost equal flips, wherever they sit.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>II · 2 — THE HONEST RULER<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Lift to the circle, walk the arc<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>Arch I built the fix already: lift each coin to its point on the Bernoulli circle, and measure <\u002Fspan><strong>along the arc<\u002Fstrong><span>.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Near the edges the arc stretches — exactly where a few flips say the most. Duel B's short flat gap becomes a <\u002Fspan><em>long<\u002Fem><span> arc.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>This arc has a classical name: the <\u002Fspan><strong>Bhattacharyya angle<\u002Fstrong><span> between two distributions.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>And it is the ruler that counts: the flips you need grow as 1/(arc)². Equal arcs cost equal flips — anywhere on the circle.<\u002Fspan><\u002Fp>\n        <sc-if value=\"{{ showFormulas }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"align-self:flex-start; font-family:'IBM Plex Mono', monospace; font-size:25px; padding:14px 24px; border:1.5px solid #AFE0F7; border-radius:8px; background:#FFF4E8;\"><span>overlap of two coins = cos(arc between them)<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 520\" style=\"width:100%; display:block;\">\n          <line x1=\"90\" y1=\"430\" x2=\"810\" y2=\"430\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fline>\n          <path d=\"M 150 430 A 300 300 0 0 1 750 430\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"4\" stroke-dasharray=\"10 9\"><\u002Fpath>\n          <line x1=\"450\" y1=\"430\" x2=\"510\" y2=\"430\" stroke=\"#00A1E4\" stroke-width=\"9\" stroke-linecap=\"round\"><\u002Fline>\n          <line x1=\"150\" y1=\"430\" x2=\"210\" y2=\"430\" stroke=\"#EE7203\" stroke-width=\"9\" stroke-linecap=\"round\"><\u002Fline>\n          <path d=\"M 450 130 A 300 300 0 0 1 510 136.1\" fill=\"none\" stroke=\"#00A1E4\" stroke-width=\"9\" stroke-linecap=\"round\"><\u002Fpath>\n          <path d=\"M 150 430 A 300 300 0 0 1 210 250\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"9\" stroke-linecap=\"round\"><\u002Fpath>\n          <line x1=\"450\" y1=\"430\" x2=\"450\" y2=\"130\" stroke=\"#5C6E8F\" stroke-width=\"2\" stroke-dasharray=\"4 5\"><\u002Fline>\n          <line x1=\"510\" y1=\"430\" x2=\"510\" y2=\"136\" stroke=\"#5C6E8F\" stroke-width=\"2\" stroke-dasharray=\"4 5\"><\u002Fline>\n          <line x1=\"210\" y1=\"430\" x2=\"210\" y2=\"250\" stroke=\"#5C6E8F\" stroke-width=\"2\" stroke-dasharray=\"4 5\"><\u002Fline>\n          <text x=\"480\" y=\"92\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#00A1E4\">duel A · short arc<\u002Ftext>\n          <text x=\"140\" y=\"192\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#EE7203\">duel B · long arc<\u002Ftext>\n          <text x=\"450\" y=\"486\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#5C6E8F\">same flat gaps, lifted — now the ruler tells the truth<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Bend every diameter\" data-speaker-notes=\"One distance is still missing: fair coin vs mystery coin — same odds, different beliefs, both inside the disk. The flat disk fails just like the flat interval did. The cure, applied everywhere: every diameter of the disk is a fresh copy of the interval — bend each one into its own Bernoulli semicircle. They agree wherever they cross and share one summit; together they form the Bernoulli hemisphere. The mystery coin rides the center up to the top.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>II · 3 — INTO THE DISK<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Bend every diameter: the disk becomes a bowl<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>One distance is still missing — the one we started with: fair coin vs mystery coin, <\u002Fspan><em>inside<\u002Fem><span> the disk.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Every diameter of the disk is a fresh copy of the interval [0, 1]. And we just learned what to do with an interval: <\u002Fspan><strong>bend it into its Bernoulli semicircle<\u002Fstrong><span>.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Do it to <\u002Fspan><em>every<\u002Fem><span> diameter at once. The bent arcs agree wherever they cross and share one summit — together they form the <\u002Fspan><strong>Bernoulli hemisphere<\u002Fstrong><span>.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>The mystery coin, at the center of every diameter, rides up to the summit.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 560\" style=\"width:100%; display:block;\">\n          <ellipse cx=\"240\" cy=\"430\" rx=\"175\" ry=\"54\" fill=\"#FDE9D3\" fill-opacity=\"0.4\"><\u002Fellipse>\n          <ellipse cx=\"240\" cy=\"430\" rx=\"175\" ry=\"54\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"3\" stroke-dasharray=\"8 7\"><\u002Fellipse>\n          <line x1=\"65\" y1=\"430\" x2=\"415\" y2=\"430\" stroke=\"#5C6E8F\" stroke-width=\"2.5\"><\u002Fline>\n          <line x1=\"130\" y1=\"463\" x2=\"350\" y2=\"397\" stroke=\"#5C6E8F\" stroke-width=\"2\" stroke-dasharray=\"5 5\"><\u002Fline>\n          <line x1=\"130\" y1=\"397\" x2=\"350\" y2=\"463\" stroke=\"#5C6E8F\" stroke-width=\"2\" stroke-dasharray=\"5 5\"><\u002Fline>\n          <circle cx=\"240\" cy=\"430\" r=\"9\" fill=\"#F71D25\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fcircle>\n          <text x=\"65\" y=\"530\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">diameters: copies of [0,1]<\u002Ftext>\n          <text x=\"465\" y=\"292\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"42\" fill=\"#5C6E8F\">→<\u002Ftext>\n          <ellipse cx=\"690\" cy=\"430\" rx=\"175\" ry=\"54\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"3\" stroke-dasharray=\"8 7\"><\u002Fellipse>\n          <path d=\"M 515 430 A 175 158 0 0 1 865 430\" fill=\"none\" stroke=\"#00A1E4\" stroke-width=\"4\"><\u002Fpath>\n          <path d=\"M 580 463 Q 690 114 800 397\" fill=\"none\" stroke=\"#8FCDEE\" stroke-width=\"2.2\" stroke-dasharray=\"5 6\"><\u002Fpath>\n          <path d=\"M 580 397 Q 690 114 800 463\" fill=\"none\" stroke=\"#8FCDEE\" stroke-width=\"2.2\" stroke-dasharray=\"5 6\"><\u002Fpath>\n          <line x1=\"690\" y1=\"272\" x2=\"690\" y2=\"430\" stroke=\"#5C6E8F\" stroke-width=\"2\" stroke-dasharray=\"4 5\"><\u002Fline>\n          <circle cx=\"690\" cy=\"430\" r=\"7\" fill=\"#5C6E8F\"><\u002Fcircle>\n          <circle cx=\"690\" cy=\"272\" r=\"11\" fill=\"#F71D25\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"690\" y=\"222\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#F71D25\">mystery coin at the summit<\u002Ftext>\n          <text x=\"865\" y=\"530\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">all bent at once: the bowl<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Bures distance\" data-speaker-notes=\"On the bowl, distance means the geodesic — the shortest walk along the surface. Fair coin on the rim to mystery coin at the summit: exactly pi over 4. This distance has an official name: the Bures distance — and it is precisely the distance quantum information theory uses today between density matrices, the quantum states you met as the disk. A purely statistical question, answered honestly, produced quantum's own ruler.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>II · 4 — THE RULER OF QUANTUM INFORMATION<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>The walk on the bowl is the Bures distance<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>On the bowl, distance means the <\u002Fspan><strong>geodesic<\u002Fstrong><span>: the shortest walk along the surface.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Fair coin on the rim, mystery coin at the summit: a crisp <\u002Fspan><strong style=\"color:#EE7203;\">π/4<\u002Fstrong><span> apart — forever identical in their odds, cleanly separated by the walk.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Its official name: the <\u002Fspan><strong>Bures distance<\u002Fstrong><span> — the very distance quantum information theory uses between quantum states (the <\u002Fspan><em>density matrices<\u002Fem><span> hiding in your disk).<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>A purely statistical question, answered honestly, has handed us quantum's own ruler. Arch II closes.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 560\" style=\"width:100%; display:block;\">\n          <ellipse cx=\"450\" cy=\"400\" rx=\"300\" ry=\"90\" fill=\"#FDE9D3\" fill-opacity=\"0.35\"><\u002Fellipse>\n          <ellipse cx=\"450\" cy=\"400\" rx=\"300\" ry=\"90\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"3.5\" stroke-dasharray=\"9 8\"><\u002Fellipse>\n          <path d=\"M 150 400 A 300 270 0 0 1 750 400\" fill=\"none\" stroke=\"#00A1E4\" stroke-width=\"4\"><\u002Fpath>\n          <ellipse cx=\"450\" cy=\"310\" rx=\"283\" ry=\"85\" fill=\"none\" stroke=\"#AFE0F7\" stroke-width=\"1.8\" stroke-dasharray=\"5 6\"><\u002Fellipse>\n          <ellipse cx=\"450\" cy=\"215\" rx=\"224\" ry=\"67\" fill=\"none\" stroke=\"#AFE0F7\" stroke-width=\"1.8\" stroke-dasharray=\"5 6\"><\u002Fellipse>\n          <line x1=\"450\" y1=\"130\" x2=\"450\" y2=\"400\" stroke=\"#5C6E8F\" stroke-width=\"2\" stroke-dasharray=\"4 5\"><\u002Fline>\n          <circle cx=\"450\" cy=\"400\" r=\"7\" fill=\"#5C6E8F\"><\u002Fcircle>\n          <path d=\"M 600 478 C 600 390 555 210 450 130\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"7\" stroke-linecap=\"round\"><\u002Fpath>\n          <circle cx=\"600\" cy=\"478\" r=\"11\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <circle cx=\"300\" cy=\"322\" r=\"9\" fill=\"#F71D25\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fcircle>\n          <circle cx=\"450\" cy=\"130\" r=\"11\" fill=\"#002157\" stroke=\"#FFFFFF\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"655\" y=\"300\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"32\" font-weight=\"600\" fill=\"#EE7203\">π/4<\u002Ftext>\n          <text x=\"450\" y=\"98\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#002157\">mystery coin · at the summit<\u002Ftext>\n          <text x=\"632\" y=\"512\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#EE7203\">fair coin<\u002Ftext>\n          <text x=\"288\" y=\"296\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#F71D25\">anti-coin<\u002Ftext>\n          <text x=\"120\" y=\"540\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#00A1E4\">the gold walk: the Bures distance<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Arch III divider\" data-speaker-notes=\"Arch three asks what that distance means — and the answer is quantum information's own way of measuring: never ask a state where it is; pick an axle, and ask which end. This arch is the keystone joining the other two.\" style=\"display:flex; flex-direction:column; align-items:center; justify-content:center; gap:32px; background:#002157; background-image:repeating-linear-gradient(to right, rgba(255,255,255,0.05) 0 1.5px, transparent 1.5px 48px), repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0 1.5px, transparent 1.5px 48px); color:#FFFFFF; font-family:'Fraunces', Georgia, serif; box-sizing:border-box; padding:100px;\">\n    <div style=\"font-family:'IBM Plex Mono', monospace; font-size:26px; letter-spacing:4px; color:#EE7203; font-weight:600;\"><span>ARCH III<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-size:88px; font-weight:700; margin:0; letter-spacing:-1.5px; text-align:center;\"><span>What does the distance mean?<\u002Fspan><\u002Fh2>\n    <p style=\"font-family:'IBM Plex Mono', monospace; font-size:28px; color:#AFE0F7; margin:0; text-align:center;\"><span>the keystone — where arch I's states meet arch II's ruler<\u002Fspan><\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Ask which end\" data-speaker-notes=\"Rule of the quantum game: you may never ask a state where it is. Pick a diameter of the disk — read it as an axle — and ask: which end? The odds are geometry: the chance of each answer is the squared distance to the opposite end. Every state is fully certain about exactly one axle — its own diameter. Randomness is a mismatch between state and question. And the answer is not sitting there waiting: it comes into being at the moment you ask — that is what makes the mystery coin classical and the qubit not.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>III · 1 — MEASURING, THE QUANTUM WAY<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Never ask where — pick an axle, ask which end<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>Rule of the game: you may never ask a state <\u002Fspan><em>\"where are you?\"<\u002Fem><span>. You pick a diameter — an <\u002Fspan><strong>axle<\u002Fstrong><span> through the disk — and ask: <\u002Fspan><em>which end?<\u002Fem><\u002Fp>\n        <p style=\"margin:0;\"><span>The odds are drawn in the picture: the chance of an answer is the <\u002Fspan><strong>squared distance to the opposite end<\u002Fstrong><span>.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Every state is 100% sure about exactly one axle — its own diameter. Randomness is a <\u002Fspan><em>mismatch<\u002Fem><span> between state and question.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>And unlike the mystery coin, the answer is not sitting there waiting — it comes into being <\u002Fspan><em>at the moment you ask<\u002Fem><span>.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 600\" style=\"width:96%; display:block;\">\n          <path d=\"M 220 290 A 230 230 0 0 1 680 290\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"4\" stroke-dasharray=\"9 8\"><\u002Fpath>\n          <path d=\"M 220 290 A 230 230 0 0 0 680 290\" fill=\"none\" stroke=\"#F71D25\" stroke-width=\"4\" stroke-dasharray=\"9 8\"><\u002Fpath>\n          <line x1=\"262\" y1=\"422\" x2=\"638\" y2=\"158\" stroke=\"#002157\" stroke-width=\"3.5\"><\u002Fline>\n          <circle cx=\"450\" cy=\"290\" r=\"5\" fill=\"#5C6E8F\"><\u002Fcircle>\n          <line x1=\"371\" y1=\"74\" x2=\"262\" y2=\"422\" stroke=\"#00A1E4\" stroke-width=\"4\"><\u002Fline>\n          <line x1=\"371\" y1=\"74\" x2=\"638\" y2=\"158\" stroke=\"#EE7203\" stroke-width=\"4\"><\u002Fline>\n          <circle cx=\"638\" cy=\"158\" r=\"10\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fcircle>\n          <circle cx=\"262\" cy=\"422\" r=\"10\" fill=\"#00A1E4\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fcircle>\n          <circle cx=\"371\" cy=\"74\" r=\"11\" fill=\"#002157\" stroke=\"#FFFFFF\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"371\" y=\"44\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#002157\">state<\u002Ftext>\n          <text x=\"662\" y=\"140\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#EE7203\">end ⊕<\u002Ftext>\n          <text x=\"240\" y=\"458\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#00A1E4\">end ⊖<\u002Ftext>\n          <text x=\"450\" y=\"580\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#5C6E8F\">P(answers ⊕) = (teal chord)² · P(answers ⊖) = (gold chord)²<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Cashing in\" data-speaker-notes=\"Now join the arches. Build a tester for 'are you the fair coin?' — that is just the axle through the fair coin and the anti-coin. A candidate passes with probability cos-squared of its Bures distance to the fair coin. Check: the mystery coin sits pi/4 away, cos-squared pi/4 is one half — it passes half the time. Flatten the triangle: base = the test axle, candidate above on the semicircle, legs root-P-pass and root-P-fail. Arch II's distance predicts arch III's odds — measuring IS judging how far apart states sit.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>III · 2 — THE ARCHES MEET<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Distance cashes in as probability<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>Build a tester for <\u002Fspan><em>\"are you the fair coin?\"<\u002Fem><span> — simply the axle through the fair coin and the anti-coin.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>A candidate <\u002Fspan><strong>passes<\u002Fstrong><span> with probability cos² of its Bures distance to the fair coin.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Check it: the mystery coin sits π/4 away — cos²(π/4) = ½ — it passes <\u002Fspan><strong>half the time<\u002Fstrong><span>. Geometry, cashed in as probability.<\u002Fspan><\u002Fp>\n        <sc-if value=\"{{ showFormulas }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"align-self:flex-start; font-family:'IBM Plex Mono', monospace; font-size:25px; padding:14px 24px; border:1.5px solid #AFE0F7; border-radius:8px; background:#FFF4E8; display:flex; flex-direction:column;\"><span style=\"white-space:nowrap;\">P(pass) = cos²(distance)<\u002Fspan><span style=\"white-space:nowrap;\">distance = arccos(√P(pass))<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>Arch II's ruler predicts arch III's odds: measuring <\u002Fspan><em>is<\u002Fem><span> judging how far apart states sit.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 540\" style=\"width:96%; display:block;\">\n          <path d=\"M 170 430 A 280 280 0 0 1 730 430\" fill=\"none\" stroke=\"#AFE0F7\" stroke-width=\"3\" stroke-dasharray=\"10 8\"><\u002Fpath>\n          <line x1=\"170\" y1=\"430\" x2=\"730\" y2=\"430\" stroke=\"#002157\" stroke-width=\"4\"><\u002Fline>\n          <path d=\"M 450 150 A 280 280 0 0 1 730 430\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fpath>\n          <path d=\"M 240 430 A 70 70 0 0 0 219.5 380.5\" fill=\"none\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fpath>\n          <text x=\"298\" y=\"404\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"27\" font-weight=\"600\" fill=\"#002157\">π/4<\u002Ftext>\n          <line x1=\"170\" y1=\"430\" x2=\"450\" y2=\"150\" stroke=\"#002157\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fline>\n          <line x1=\"730\" y1=\"430\" x2=\"450\" y2=\"150\" stroke=\"#F71D25\" stroke-width=\"3.5\" stroke-dasharray=\"7 6\"><\u002Fline>\n          <polyline points=\"430.2,169.8 450,189.6 469.8,169.8\" fill=\"none\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fpolyline>\n          <text x=\"450\" y=\"330\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">right angle · Thales<\u002Ftext>\n          <circle cx=\"170\" cy=\"430\" r=\"11\" fill=\"#F71D25\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <circle cx=\"730\" cy=\"430\" r=\"11\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <circle cx=\"450\" cy=\"150\" r=\"12\" fill=\"#002157\" stroke=\"#FFFFFF\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"450\" y=\"118\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#002157\">mystery coin<\u002Ftext>\n          <text x=\"170\" y=\"482\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#F71D25\">anti-coin<\u002Ftext>\n          <text x=\"730\" y=\"482\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#EE7203\">fair coin<\u002Ftext>\n          <text x=\"712\" y=\"196\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"30\" font-weight=\"600\" fill=\"#EE7203\">π/4<\u002Ftext>\n          <text x=\"278\" y=\"258\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#002157\" transform=\"rotate(-45 278 258)\">√P(pass)<\u002Ftext>\n          <text x=\"622\" y=\"258\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#F71D25\" transform=\"rotate(45 622 258)\">√P(fail)<\u002Ftext>\n          <text x=\"450\" y=\"524\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">the Bures walk: a quarter of a circle, round-trip π<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Three arches, one stage\" data-speaker-notes=\"Step back. Two statistical questions — what is a state, and how far apart are two states — contained no quantum physics at all. Answering them honestly forced the circle, the disk, the bowl and the axles into existence. Quantum mechanics is the discovery that nature actually performs on this whole stage — lower half, dial and all. That is the closing thought before the bonus.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>III · 3 — THE KEYSTONE<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Two honest questions built the quantum stage<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:stretch; justify-content:center; gap:34px; margin-top:80px;\">\n      <div style=\"width:420px; display:flex; flex-direction:column; align-items:center; gap:20px; border:2px solid #AFE0F7; border-radius:14px; padding:34px 28px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px);\">\n        <svg sc-camel-view-box=\"0 0 200 130\" style=\"width:190px; display:block;\">\n          <circle cx=\"100\" cy=\"65\" r=\"50\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"4\" stroke-dasharray=\"8 7\"><\u002Fcircle>\n          <line x1=\"50\" y1=\"65\" x2=\"150\" y2=\"65\" stroke=\"#5C6E8F\" stroke-width=\"2\" stroke-dasharray=\"4 4\"><\u002Fline>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; color:#002157; text-align:center; line-height:1.5;\"><span>ARCH I · what is a state? → the disk<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:420px; display:flex; flex-direction:column; align-items:center; gap:20px; border:2px solid #AFE0F7; border-radius:14px; padding:34px 28px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px);\">\n        <svg sc-camel-view-box=\"0 0 200 130\" style=\"width:190px; display:block;\">\n          <ellipse cx=\"100\" cy=\"95\" rx=\"70\" ry=\"22\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"3\" stroke-dasharray=\"6 5\"><\u002Fellipse>\n          <path d=\"M 30 95 A 70 62 0 0 1 170 95\" fill=\"none\" stroke=\"#00A1E4\" stroke-width=\"3.5\"><\u002Fpath>\n          <circle cx=\"100\" cy=\"33\" r=\"6\" fill=\"#F71D25\"><\u002Fcircle>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; color:#002157; text-align:center; line-height:1.5;\"><span>ARCH II · how far apart? → the bowl<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:420px; display:flex; flex-direction:column; align-items:center; gap:20px; border:2px solid #EE7203; border-radius:14px; padding:34px 28px; background:#FFF4E8;\">\n        <svg sc-camel-view-box=\"0 0 200 130\" style=\"width:190px; display:block;\">\n          <line x1=\"30\" y1=\"105\" x2=\"170\" y2=\"105\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fline>\n          <line x1=\"30\" y1=\"105\" x2=\"100\" y2=\"35\" stroke=\"#002157\" stroke-width=\"4\"><\u002Fline>\n          <line x1=\"170\" y1=\"105\" x2=\"100\" y2=\"35\" stroke=\"#F71D25\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"><\u002Fline>\n          <circle cx=\"100\" cy=\"35\" r=\"6\" fill=\"#002157\"><\u002Fcircle>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; font-weight:600; color:#002157; text-align:center; line-height:1.5;\"><span>ARCH III · what does it mean? → the odds<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:70px auto 0; max-width:1400px; font-size:32px; line-height:1.55; text-align:center;\"><span>Neither question contained any quantum physics. Answering them honestly forced this whole stage into existence — and quantum mechanics is the discovery that nature performs on it.<\u002Fspan><\u002Fp>\n    <p style=\"margin:14px auto 0; max-width:1400px; font-size:32px; line-height:1.55; text-align:center;\"><strong>You built a qubit from a coin — nature had built it first.<\u002Fstrong><\u002Fp>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ includeBonus }}\" hint-placeholder-val=\"{{ true }}\">\n\n  <section data-label=\"Bonus divider\" data-speaker-notes=\"The tutorial calls this the evidence room: is it a nice story, or an actual construction? It is a construction — the professionals' machinery (density matrices, spectral decomposition, statistical distances) fits the picture without leaving a remainder. We pay arch II's debt by counting the flips, discover why the arc is the only honest ruler, peek at the matrix under the hood, and meet the state's own axes.\" style=\"display:flex; flex-direction:column; align-items:center; justify-content:center; gap:32px; background:#002157; background-image:repeating-linear-gradient(to right, rgba(255,255,255,0.05) 0 1.5px, transparent 1.5px 48px), repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0 1.5px, transparent 1.5px 48px); color:#FFFFFF; font-family:'Fraunces', Georgia, serif; box-sizing:border-box; padding:100px;\">\n    <div style=\"font-family:'IBM Plex Mono', monospace; font-size:26px; letter-spacing:4px; color:#EE7203; font-weight:600;\"><span>BONUS<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-size:88px; font-weight:700; margin:0; letter-spacing:-1.5px; text-align:center;\"><span>The evidence room<\u002Fspan><\u002Fh2>\n    <p style=\"font-family:'IBM Plex Mono', monospace; font-size:28px; color:#AFE0F7; margin:0; text-align:center;\"><span>a nice story, or an actual construction? — the proof, room by room<\u002Fspan><\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"The race\" data-speaker-notes=\"Arch II promised the circle predicts how many flips you need — let's collect. Referee: Wald's sequential test. Every flip adds its evidence to a running total; the moment the total crosses a wall (set for 5% error either way) the verdict is called. Duel A (0.50 vs 0.60) wanders for about 140 flips. Duel B (0.00 vs 0.10) plods through tails until one head ends the game instantly — about 20 flips. Same flat gap, tenfold difference, exactly as promised.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>BONUS 1 · COUNTING THE FLIPS<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Race the two duels — with an honest referee<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>Arch II promised that the circle predicts <\u002Fspan><em>how many flips<\u002Fem><span> you need. Time to collect.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>The referee is Wald's <\u002Fspan><strong>sequential test<\u002Fstrong><span>: every flip adds its evidence to a running total, and the moment the total crosses a wall — set for 5% error — the verdict is called.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><strong style=\"color:#00A1E4;\">Duel A<\u002Fstrong><span> wanders between the walls for ≈ 140 flips.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><strong style=\"color:#EE7203;\">Duel B<\u002Fstrong><span> plods through tails — until one head ends the game on the spot. ≈ 20 flips.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 520\" style=\"width:100%; display:block;\">\n          <line x1=\"100\" y1=\"110\" x2=\"820\" y2=\"110\" stroke=\"#EE7203\" stroke-width=\"4\"><\u002Fline>\n          <line x1=\"100\" y1=\"410\" x2=\"820\" y2=\"410\" stroke=\"#00A1E4\" stroke-width=\"4\"><\u002Fline>\n          <line x1=\"100\" y1=\"260\" x2=\"820\" y2=\"260\" stroke=\"#AFE0F7\" stroke-width=\"2\" stroke-dasharray=\"5 5\"><\u002Fline>\n          <text x=\"110\" y=\"86\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#EE7203\">wall: call it for coin 2 · 5% error<\u002Ftext>\n          <text x=\"110\" y=\"446\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#00A1E4\">wall: call it for coin 1<\u002Ftext>\n          <polyline points=\"100,260 147,238 194,282 241,222 288,264 335,208 382,244 429,186 476,232 523,178 570,214 617,162 664,196 711,150 758,110\" fill=\"none\" stroke=\"#00A1E4\" stroke-width=\"4\" stroke-linejoin=\"round\"><\u002Fpolyline>\n          <circle cx=\"758\" cy=\"110\" r=\"10\" fill=\"#00A1E4\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fcircle>\n          <text x=\"760\" y=\"318\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#00A1E4\">duel A · ≈140 flips<\u002Ftext>\n          <polyline points=\"100,260 140,285 180,310 220,335 232,110\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"4\" stroke-linejoin=\"round\"><\u002Fpolyline>\n          <circle cx=\"232\" cy=\"110\" r=\"10\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fcircle>\n          <text x=\"286\" y=\"368\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#EE7203\">duel B · one head — game over<\u002Ftext>\n          <text x=\"820\" y=\"500\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">flips →<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"By hand\" data-speaker-notes=\"The same numbers by hand. Duel A: after n flips the head-fraction wobbles about 0.5 over root n; demand the wobble shrink below the half-gap 0.05 with 5% error and you need roughly 270 flips fixed-length — the thrifty sequential referee averages about 140, same order. Duel B: the 0.00-coin cannot produce a head, so a single H ends the game; the only possible error is the 0.10-coin sulking through all tails, 0.9 to the n, and demanding that below 5% gives 29 flips worst case. Same flat gap of 0.10 — a factor of ten in flips.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>BONUS 2 · BY HAND<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Both flip counts, on the back of an envelope<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:50px; margin-top:56px;\">\n      <div style=\"flex:1; border:2px solid #00A1E4; border-radius:14px; padding:44px 48px; display:flex; flex-direction:column; gap:24px;\">\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:2px; color:#00A1E4; font-weight:600;\"><span>DUEL A · 0.50 VS 0.60<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0; font-size:29px; line-height:1.55;\"><span>After n flips the head-count wobbles by about <\u002Fspan><strong style=\"white-space:nowrap;\">0.5/√n<\u002Fstrong><span>. The verdict is safe once the wobble shrinks below the half-gap, 0.05.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; font-size:29px; line-height:1.55; color:#5C6E8F;\"><span>That takes <\u002Fspan><strong style=\"color:#002157;\">≈ 270 flips<\u002Fstrong><span> at fixed length — the thrifty referee averages ≈ 145. Same order.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; border:2px solid #EE7203; border-radius:14px; padding:44px 48px; display:flex; flex-direction:column; gap:24px;\">\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:2px; color:#EE7203; font-weight:600;\"><span>DUEL B · 0.00 VS 0.10<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0; font-size:29px; line-height:1.55;\"><span>The 0.00-coin <\u002Fspan><em>cannot<\u002Fem><span> produce a head — a single H ends the game. The only mistake left: the 0.10-coin sulking through all tails, chance 0.9ⁿ.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; font-size:29px; line-height:1.55; color:#5C6E8F;\"><span>Demand 0.9ⁿ ≤ 5% and you get <\u002Fspan><strong style=\"color:#002157;\">≈ 29 flips<\u002Fstrong><span>, worst case — and one head usually ends it much sooner.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:64px auto 0; max-width:1300px; font-size:32px; line-height:1.55; text-align:center;\"><span>Same gap of 0.10 — a factor of <\u002Fspan><strong>ten<\u002Fstrong><span> in flips. The envelope agrees with the race.<\u002Fspan><\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"One law\" data-speaker-notes=\"One law behind both numbers. For the best possible test, the error shrinks like the n-th power of the overlap between the two coins. Lift each coin to its angle on the circle and that overlap is simply the cosine of the arc between them. So the flip budget grows as one over the arc squared. Check: duel A spans an arc of 0.101, duel B an arc of 0.322 — the circle predicts a ratio of about ten, the race delivers about ten, and the flat ruler predicted one.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>BONUS 3 · ONE LAW BEHIND BOTH<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>The overlap of two coins is the cosine of their arc<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>For the best possible test, the error shrinks like the n-th power of the <\u002Fspan><strong>overlap<\u002Fstrong><span> between the two coins.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Lift each coin to the circle, and the overlap turns out to be nothing but the <\u002Fspan><strong>cosine of the arc<\u002Fstrong><span> between them. Flip budget: 1/(arc)².<\u002Fspan><\u002Fp>\n        <sc-if value=\"{{ showFormulas }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"align-self:flex-start; font-family:'IBM Plex Mono', monospace; font-size:25px; padding:14px 24px; border:1.5px solid #AFE0F7; border-radius:8px; background:#FFF4E8; display:flex; flex-direction:column; gap:6px;\"><span style=\"white-space:nowrap;\">overlap = cos(arc)<\u002Fspan><span style=\"white-space:nowrap;\">flips ≈ 2·ln(1/ε) / (arc)²<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>Check: duel A spans an arc of 0.101, duel B spans 0.322 — the circle predicts ×10, the race clocked ×10, the flat ruler said ×1.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 520\" style=\"width:100%; display:block;\">\n          <line x1=\"90\" y1=\"430\" x2=\"810\" y2=\"430\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fline>\n          <path d=\"M 150 430 A 300 300 0 0 1 750 430\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"4\" stroke-dasharray=\"10 9\"><\u002Fpath>\n          <path d=\"M 450 130 A 300 300 0 0 1 510 136.1\" fill=\"none\" stroke=\"#00A1E4\" stroke-width=\"9\" stroke-linecap=\"round\"><\u002Fpath>\n          <path d=\"M 150 430 A 300 300 0 0 1 210 250\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"9\" stroke-linecap=\"round\"><\u002Fpath>\n          <text x=\"480\" y=\"92\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#00A1E4\">duel A · arc 0.101<\u002Ftext>\n          <text x=\"230\" y=\"130\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#EE7203\">duel B · arc 0.322<\u002Ftext>\n          <text x=\"450\" y=\"330\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"28\" font-weight=\"600\" fill=\"#002157\">(0.322 / 0.101)² ≈ 10<\u002Ftext>\n          <text x=\"450\" y=\"486\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">predicted ×10 · raced ×10 · flat ruler ×1<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The only ruler\" data-speaker-notes=\"Why is the arc not just a good ruler but the ruler? Three escalating reasons. Local: the information in one flip explodes near the edges — exactly the flat ruler's blind spot; ask for the coordinate where every flip buys equal progress and you are forced onto the circle (statisticians know it as the arcsine transformation). Global: over any separation the cost is set by cos(arc) — equal arcs cost equal flips, anywhere. Unique: Čencov's theorem — an honest distance may only shrink when you post-process data, and this arc is the only ruler with that property, up to scale. The same cosine returns as the quantum overlap: the Bures walk of arch II, and the cos²(π/4) = ½ of arch III.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>BONUS 4 · WHY THE ARC, OF ALL RULERS<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Not just a good ruler — the only honest one<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:44px; margin-top:60px;\">\n      <div style=\"flex:1; border:2px solid #AFE0F7; border-radius:14px; padding:40px 44px; display:flex; flex-direction:column; gap:20px;\">\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:2px; color:#00A1E4; font-weight:600;\"><span>LOCAL<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0; font-size:28px; line-height:1.55;\"><span>One flip says most near the edges — the flat ruler's blind spot. Demand a scale where every flip buys <\u002Fspan><em>equal progress<\u002Fem><span>, and you are forced onto the circle.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; border:2px solid #AFE0F7; border-radius:14px; padding:40px 44px; display:flex; flex-direction:column; gap:20px;\">\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:2px; color:#00A1E4; font-weight:600;\"><span>GLOBAL<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0; font-size:28px; line-height:1.55;\"><span>Over any separation the cost of telling coins apart is set by cos(arc): <\u002Fspan><em>equal arcs cost equal flips<\u002Fem><span>, wherever they sit.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; border:2px solid #EE7203; border-radius:14px; padding:40px 44px; display:flex; flex-direction:column; gap:20px; background:#FFF4E8;\">\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:2px; color:#EE7203; font-weight:600;\"><span>UNIQUE<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0; font-size:28px; line-height:1.55;\"><span>Čencov's theorem: an honest distance may only <\u002Fspan><em>shrink<\u002Fem><span> when you post-process data — and the arc is the <\u002Fspan><strong>only<\u002Fstrong><span> ruler with that property.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:66px auto 0; max-width:1400px; font-size:32px; line-height:1.55; text-align:center;\"><span>Keep the cosine in your pocket: it returns as the quantum overlap —<\u002Fspan><\u002Fp>\n    <p style=\"margin:8px auto 0; max-width:1400px; font-size:32px; line-height:1.55; text-align:center;\"><span>the Bures walk of arch II, and the cos²(π/4) = ½ of arch III.<\u002Fspan><\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Under the hood\" data-speaker-notes=\"Last peek under the hood: the disk you have been drawing is, cell for cell, a 2-by-2 table — the density matrix. Top row: your two coordinates, average and orientation. Mixing beliefs averages tables — that is why blends were straight chords. And the Bures distance of arch II is exactly the textbook distance between these matrices. Everything in the talk was matrix arithmetic wearing a coin costume.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>BONUS 5 · UNDER THE HOOD<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Your disk was a density matrix all along<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>Every point of the disk is secretly a small <\u002Fspan><strong>2 × 2 table<\u002Fstrong><span> — physicists call it the <\u002Fspan><em>density matrix<\u002Fem><span>. Its top row holds exactly your two coordinates: the odds and the orientation.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Mixing beliefs = averaging tables. That is why blends were straight chords all along.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>And arch II's walk on the bowl is precisely the textbook <\u002Fspan><strong>Bures distance between density matrices<\u002Fstrong><span> — the tutorial has been doing quantum information's bookkeeping in a coin costume.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 520\" style=\"width:96%; display:block;\">\n          <circle cx=\"240\" cy=\"260\" r=\"170\" fill=\"#FDE9D3\" fill-opacity=\"0.4\" stroke=\"#EE7203\" stroke-width=\"3.5\" stroke-dasharray=\"9 8\"><\u002Fcircle>\n          <line x1=\"70\" y1=\"260\" x2=\"410\" y2=\"260\" stroke=\"#5C6E8F\" stroke-width=\"2\" stroke-dasharray=\"4 5\"><\u002Fline>\n          <circle cx=\"310\" cy=\"170\" r=\"11\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"288\" y=\"162\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#002157\">(p, w)<\u002Ftext>\n          <text x=\"240\" y=\"490\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#5C6E8F\">a point of the disk…<\u002Ftext>\n          <text x=\"480\" y=\"272\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"42\" fill=\"#5C6E8F\">=<\u002Ftext>\n          <rect x=\"560\" y=\"150\" width=\"130\" height=\"100\" rx=\"8\" fill=\"#FFF4E8\" stroke=\"#EE7203\" stroke-width=\"3\"><\u002Frect>\n          <rect x=\"700\" y=\"150\" width=\"130\" height=\"100\" rx=\"8\" fill=\"#FFF4E8\" stroke=\"#EE7203\" stroke-width=\"3\"><\u002Frect>\n          <rect x=\"560\" y=\"260\" width=\"130\" height=\"100\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#AFE0F7\" stroke-width=\"3\"><\u002Frect>\n          <rect x=\"700\" y=\"260\" width=\"130\" height=\"100\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#AFE0F7\" stroke-width=\"3\"><\u002Frect>\n          <text x=\"625\" y=\"212\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"36\" font-weight=\"600\" fill=\"#002157\">p<\u002Ftext>\n          <text x=\"765\" y=\"212\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"36\" font-weight=\"600\" fill=\"#002157\">w<\u002Ftext>\n          <text x=\"625\" y=\"322\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"36\" fill=\"#5C6E8F\">w<\u002Ftext>\n          <text x=\"765\" y=\"322\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"36\" fill=\"#5C6E8F\">1−p<\u002Ftext>\n          <text x=\"830\" y=\"440\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">…is a 2×2 table: the density matrix<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The state's own axes\" data-speaker-notes=\"The last room: spectral decomposition, in pictures. Step 5's mixer left an ambiguity — many chords pass through one interior point; many ensembles, one belief. The matrix breaks the tie: every state carries one distinguished chord, its own diameter. The quantum dictionary is shorter than its reputation: a question is an observable; the diameter's endpoints are its eigen-states — the only states answering with certainty; eigenvalues are the measured values on the endpoints, or for the state's own matrix the weights λ±. And the move 'find the object's own axes' is what data science does daily as PCA: the density matrix is a covariance table for a belief, so its spectral decomposition IS PCA applied to a belief. Whenever a physicist says eigen-something: picture a diameter with its two endpoints — nothing more.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>BONUS 6 · THE STATE'S OWN AXES<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Every state chooses its own diameter<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>The mixer left an ambiguity: <\u002Fspan><em>many<\u002Fem><span> chords pass through one interior point — many recipes, one belief. The matrix breaks the tie: every state carries one distinguished chord, <\u002Fspan><strong>its own diameter<\u002Fstrong><span>.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>That is the whole quantum dictionary: the diameter's endpoints are the <\u002Fspan><strong>eigen-states<\u002Fstrong><span> — the only ones that answer with certainty; the <\u002Fspan><strong>eigenvalues<\u002Fstrong><span> are the values on the ends, or the weights λ± over them.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>Sound familiar? Data science does this daily as <\u002Fspan><strong>PCA<\u002Fstrong><span>: let the object choose its own axes. Spectral decomposition is PCA applied to a belief. <\u002Fspan><em>Eigen-something = a diameter with two endpoints. Nothing more.<\u002Fem><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 600\" style=\"width:92%; display:block;\">\n          <path d=\"M 220 300 A 230 230 0 0 1 680 300\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"4\" stroke-dasharray=\"9 8\"><\u002Fpath>\n          <path d=\"M 220 300 A 230 230 0 0 0 680 300\" fill=\"none\" stroke=\"#F71D25\" stroke-width=\"4\" stroke-dasharray=\"9 8\"><\u002Fpath>\n          <line x1=\"253\" y1=\"185\" x2=\"622\" y2=\"440\" stroke=\"#AFE0F7\" stroke-width=\"2.5\"><\u002Fline>\n          <line x1=\"360\" y1=\"120\" x2=\"500\" y2=\"486\" stroke=\"#AFE0F7\" stroke-width=\"2.5\"><\u002Fline>\n          <line x1=\"228\" y1=\"360\" x2=\"674\" y2=\"255\" stroke=\"#AFE0F7\" stroke-width=\"2.5\"><\u002Fline>\n          <line x1=\"329.5\" y1=\"139.5\" x2=\"570.5\" y2=\"460.5\" stroke=\"#002157\" stroke-width=\"4.5\"><\u002Fline>\n          <circle cx=\"329.5\" cy=\"139.5\" r=\"12\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <circle cx=\"570.5\" cy=\"460.5\" r=\"12\" fill=\"#FFFFFF\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <circle cx=\"435\" cy=\"280\" r=\"11\" fill=\"#00A1E4\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"280\" y=\"88\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#EE
