7203\">eigen-state · weight λ₊<\u002Ftext>\n          <text x=\"600\" y=\"502\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#002157\">eigen-state · weight λ₋<\u002Ftext>\n          <text x=\"408\" y=\"248\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#00A1E4\">the state<\u002Ftext>\n          <text x=\"700\" y=\"382\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">other recipes<\u002Ftext>\n          <text x=\"450\" y=\"570\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">many chords fit — the matrix picks the diameter<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Bonus ⊗ Bonus divider\" data-speaker-notes=\"The finale: two bonuses multiplied, not added. The mystery coin's uncertainty could always be learned away — but the summit still carries the biggest lift of all. Can that uncertainty be traded away too? Not inside one qubit. The answer lies sideways: entanglement.\" style=\"display:flex; flex-direction:column; align-items:center; justify-content:center; gap:32px; background:#002157; background-image:repeating-linear-gradient(to right, rgba(255,255,255,0.05) 0 1.5px, transparent 1.5px 48px), repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0 1.5px, transparent 1.5px 48px); color:#FFFFFF; font-family:'Fraunces', Georgia, serif; box-sizing:border-box; padding:100px;\">\n    <div style=\"font-family:'IBM Plex Mono', monospace; font-size:26px; letter-spacing:4px; color:#EE7203; font-weight:600;\"><span>BONUS ⊗ BONUS<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-size:88px; font-weight:700; margin:0; letter-spacing:-1.5px; text-align:center;\"><span>The summit needs a partner<\u002Fspan><\u002Fh2>\n    <p style=\"font-family:'IBM Plex Mono', monospace; font-size:28px; color:#AFE0F7; margin:0; text-align:center;\"><span>not two bonuses side by side — their tensor product: entanglement<\u002Fspan><\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Sideways\" data-speaker-notes=\"Look at the mystery coin with both tools. On the disk: the flattest point, only ignorance. On the bowl: the summit, the biggest lift of all. The tutorial's main trade — uncertainty ABOUT a coin becomes uncertainty INSIDE a state — worked for the fair coin. For the summit there is no room left inside the qubit: sign and dial are spent. The only direction left is sideways: give the coin a partner. And you already own one — every coin is a pair of faces, glued in disagreement by the mint: 2×2 = 4 options cut down to 2. Perfect correlation is cheap.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>⊗ 1 — ONLY ONE DIRECTION LEFT<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>No room inside the qubit — go sideways<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>The tutorial's great trade: uncertainty <\u002Fspan><em>about<\u002Fem><span> a coin can be rewritten as uncertainty <\u002Fspan><em>inside<\u002Fem><span> a state. The lift did it for the fair coin.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>Can the <\u002Fspan><strong>summit<\u002Fstrong><span> — the mystery coin, the biggest lift of all — make the same trade? Not inside the qubit: the sign is spent, the dial is spent.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>One direction remains: <\u002Fspan><strong>sideways<\u002Fstrong><span>. Give the coin a partner.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>You already own one: every coin is a pair of faces, glued in <\u002Fspan><em>disagreement<\u002Fem><span> by the mint — 2 × 2 = 4 options, cut down to 2. Perfect correlation is cheap.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 560\" style=\"width:96%; display:block;\">\n          <ellipse cx=\"450\" cy=\"330\" rx=\"270\" ry=\"82\" fill=\"#FDE9D3\" fill-opacity=\"0.35\"><\u002Fellipse>\n          <ellipse cx=\"450\" cy=\"330\" rx=\"270\" ry=\"82\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"3\" stroke-dasharray=\"9 8\"><\u002Fellipse>\n          <path d=\"M 180 330 A 270 243 0 0 1 720 330\" fill=\"none\" stroke=\"#00A1E4\" stroke-width=\"3.5\"><\u002Fpath>\n          <line x1=\"450\" y1=\"87\" x2=\"450\" y2=\"330\" stroke=\"#5C6E8F\" stroke-width=\"2\" stroke-dasharray=\"4 5\"><\u002Fline>\n          <circle cx=\"450\" cy=\"330\" r=\"7\" fill=\"#5C6E8F\"><\u002Fcircle>\n          <circle cx=\"450\" cy=\"87\" r=\"12\" fill=\"#F71D25\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"450\" y=\"52\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#F71D25\">the summit · lift ½ — nothing inside can absorb it<\u002Ftext>\n          <line x1=\"510\" y1=\"120\" x2=\"700\" y2=\"120\" stroke=\"#EE7203\" stroke-width=\"4\" stroke-dasharray=\"2 8\" stroke-linecap=\"round\"><\u002Fline>\n          <polyline points=\"678,104 706,120 678,136\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"4\" stroke-linejoin=\"round\"><\u002Fpolyline>\n          <text x=\"736\" y=\"128\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#EE7203\">sideways<\u002Ftext>\n          <text x=\"450\" y=\"500\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#5C6E8F\">the only exit is a second coin<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Two factories\" data-speaker-notes=\"Build the partner. A factory welds two whole coins in AGREEMENT — halves you can carry to different rooms. Glued factory: each pair secretly HH or secretly TT, 50/50 — a mixture. Introduce the notebook here: the choice is a fact fixed at preparation, so someone at the factory could write it down and ship it along — whether anyone actually does is irrelevant; the record is possible, and that is what makes the state a mixture. Physicists say hidden variable. Bell factory ships (HH+TT)/√2 — a superposition, amplitudes added before squaring; no fact was ever created, so no notebook exists, not even a blank one. Tester: ask both halves the same δ-rotated question. The one-sided bars never move from 50% — each half alone is the mystery coin, at every angle, for both factories. But agreement separates: glued drops to a coin flip at δ = 90°; the Bell pair agrees always. Certain as a pair, maximally uncertain in each half.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>⊗ 2 — TWO FACTORIES, ONE TESTER<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Certain as a pair, uncertain in each half<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:50px; margin-top:52px;\">\n      <div style=\"flex:1; border:2px solid #00A1E4; border-radius:14px; padding:40px 44px; display:flex; flex-direction:column; gap:20px;\">\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:2px; color:#00A1E4; font-weight:600;\"><span>THE GLUED FACTORY<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0; font-size:28px; line-height:1.5;\"><span>Welds two whole coins in agreement: each pair is <\u002Fspan><em>secretly<\u002Fem><span> HH or secretly TT, 50/50. The choice is a fact — someone at the factory could jot it in a <\u002Fspan><strong>notebook<\u002Fstrong><span> and ship it along. There is something to peek at.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; border:2px solid #EE7203; border-radius:14px; padding:40px 44px; display:flex; flex-direction:column; gap:20px; background:#FFF4E8;\">\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:2px; color:#EE7203; font-weight:600;\"><span>THE BELL FACTORY<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0; font-size:28px; line-height:1.5;\"><span>Ships the <\u002Fspan><strong>Bell pair<\u002Fstrong><span> (HH + TT)/√2 — a <\u002Fspan><em>superposition<\u002Fem><span>, amplitudes added before squaring. No fact was ever created: no notebook — not even a blank one.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:44px; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); padding:30px 46px; display:flex; align-items:center; gap:54px;\">\n      <svg sc-camel-view-box=\"0 0 560 240\" style=\"width:44%; display:block;\">\n        <text x=\"20\" y=\"34\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"22\" fill=\"#5C6E8F\">agreement at δ = 90°<\u002Ftext>\n        <rect x=\"20\" y=\"60\" width=\"500\" height=\"34\" rx=\"6\" fill=\"none\" stroke=\"#AFE0F7\" stroke-width=\"2\"><\u002Frect>\n        <rect x=\"20\" y=\"60\" width=\"250\" height=\"34\" rx=\"6\" fill=\"#00A1E4\" fill-opacity=\"0.75\"><\u002Frect>\n        <text x=\"284\" y=\"84\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"22\" fill=\"#00A1E4\">glued · just 50%<\u002Ftext>\n        <rect x=\"20\" y=\"130\" width=\"500\" height=\"34\" rx=\"6\" fill=\"#EE7203\"><\u002Frect>\n        <text x=\"30\" y=\"154\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"22\" font-weight=\"600\" fill=\"#FFFFFF\">Bell pair · 100% — always<\u002Ftext>\n        <text x=\"20\" y=\"216\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"22\" fill=\"#5C6E8F\">each half alone: 50% ⊕ — at every angle<\u002Ftext>\n      <\u002Fsvg>\n      <p style=\"margin:0; flex:1; font-size:29px; line-height:1.5;\"><span>Ask <\u002Fspan><strong>both halves<\u002Fstrong><span> the same rotated question. Each half alone stays a perfect mystery coin — but the <\u002Fspan><em>agreement<\u002Fem><span> tells the factories apart. The Bell pair answers every joint question with certainty.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The corner disk\" data-speaker-notes=\"Step back and look at the arena: every state in the contest lives in the span of HH and TT — the agreement corner. Two dimensions means, by this tutorial's own construction, a Bernoulli disk. Same picture, new labels: the glued mixture N sits at the center — the corner's mystery coin; the Bell pair Φ at the top of the rim — the corner's fair coin; Φ⁻ waits at the bottom. The other two Bell states are the fair coins of the disagreement corner, where the coin's own faces have lived since step 1. Distance N to Φ: each branch overlaps Φ with probability ½, so P(pass) = ½ and distance = arccos √½ = π/4 — the old mystery-fair number, one floor up. But one-sided instruments read only lengths along the polar diameter — the corner's plain flip; only a joint measurement, both coins in one apparatus, can turn the dial.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>⊗ 3 — A DISK YOU HAVE SEEN BEFORE<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>The Bell pair is the fair coin of a joint disk<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>The whole contest happened in the span of HH and TT — the <\u002Fspan><strong>agreement corner<\u002Fstrong><span>. Two dimensions: by our own construction, a Bernoulli disk. Same picture, new labels.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>The glued mixture N is the corner's <\u002Fspan><strong>mystery coin<\u002Fstrong><span>, at the center. The Bell pair Φ is its <\u002Fspan><strong>fair coin<\u002Fstrong><span>, at the top of the rim — π/4 apart, the old number one floor up.<\u002Fspan><\u002Fp>\n        <sc-if value=\"{{ showFormulas }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"align-self:flex-start; font-family:'IBM Plex Mono', monospace; font-size:25px; padding:14px 24px; border:1.5px solid #AFE0F7; border-radius:8px; background:#FFF4E8;\"><span>distance(N, Φ) = arccos √½ = π/4<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>One hand on one coin can only work the corner's <\u002Fspan><em>plain flip<\u002Fem><span> — blind to orientation. The revealing questions are <\u002Fspan><strong>joint<\u002Fstrong><span>: both coins in one apparatus turn the dial no single hand can reach.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 600\" style=\"width:92%; display:block;\">\n          <path d=\"M 220 300 A 230 230 0 0 1 680 300\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"4\" stroke-dasharray=\"9 8\"><\u002Fpath>\n          <path d=\"M 220 300 A 230 230 0 0 0 680 300\" fill=\"none\" stroke=\"#F71D25\" stroke-width=\"4\" stroke-dasharray=\"9 8\"><\u002Fpath>\n          <line x1=\"220\" y1=\"300\" x2=\"680\" y2=\"300\" stroke=\"#002157\" stroke-width=\"2.5\"><\u002Fline>\n          <line x1=\"450\" y1=\"300\" x2=\"450\" y2=\"70\" stroke=\"#EE7203\" stroke-width=\"3\" stroke-dasharray=\"5 5\"><\u002Fline>\n          <line x1=\"287.4\" y1=\"137.4\" x2=\"612.6\" y2=\"462.6\" stroke=\"#F71D25\" stroke-width=\"3\"><\u002Fline>\n          <circle cx=\"287.4\" cy=\"137.4\" r=\"8\" fill=\"#F71D25\"><\u002Fcircle>\n          <circle cx=\"612.6\" cy=\"462.6\" r=\"8\" fill=\"#FFFFFF\" stroke=\"#F71D25\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"262\" y=\"116\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#F71D25\">joint δ-question<\u002Ftext>\n          <circle cx=\"220\" cy=\"300\" r=\"9\" fill=\"#002157\"><\u002Fcircle>\n          <circle cx=\"680\" cy=\"300\" r=\"9\" fill=\"#002157\"><\u002Fcircle>\n          <text x=\"196\" y=\"286\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">TT<\u002Ftext>\n          <text x=\"704\" y=\"286\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">HH<\u002Ftext>\n          <circle cx=\"450\" cy=\"300\" r=\"11\" fill=\"#00A1E4\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"430\" y=\"350\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#00A1E4\">N — the corner's mystery coin<\u002Ftext>\n          <circle cx=\"450\" cy=\"70\" r=\"12\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"478\" y=\"56\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#EE7203\">Φ — the corner's fair coin<\u002Ftext>\n          <circle cx=\"450\" cy=\"530\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"478\" y=\"566\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">Φ⁻ — its anti-fair coin<\u002Ftext>\n          <text x=\"438\" y=\"196\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"26\" font-weight=\"600\" fill=\"#EE7203\">π/4<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Purification\" data-speaker-notes=\"Now the partner for ANY state, not just the summit. Three moves you already know. One: read the state spectrally — with weight λ+ it is eigen-coin e+, with weight λ− it is e−; a state prepared and then forgotten. Two: make the forgetting physical — the glued factory ships e+e+ on one branch, e−e− on the other; covering the right coin already returns the original, but this is still a notebook someone could peek at. Three: the lift, one floor up — superpose the same shipments with amplitudes √λ+ and √λ−. Rank one, rim point, no notebook. That is purification.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>⊗ 4 — BUILD THE PARTNER<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Purify any state in three familiar moves<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:44px; margin-top:60px;\">\n      <div style=\"flex:1; border:2px solid #AFE0F7; border-radius:14px; padding:40px 44px; display:flex; flex-direction:column; gap:20px;\">\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:2px; color:#00A1E4; font-weight:600;\"><span>1 · READ<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0; font-size:28px; line-height:1.55;\"><span>Read the state spectrally: weight <\u002Fspan><strong>λ₊<\u002Fstrong><span> on eigen-coin e₊, weight <\u002Fspan><strong>λ₋<\u002Fstrong><span> on e₋. It is a state that was prepared, then forgotten.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; border:2px solid #AFE0F7; border-radius:14px; padding:40px 44px; display:flex; flex-direction:column; gap:20px;\">\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:2px; color:#00A1E4; font-weight:600;\"><span>2 · SHIP<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0; font-size:28px; line-height:1.55;\"><span>Make it physical: the glued factory ships e₊e₊ or e₋e₋ per branch. Cover the partner: the original returns — notebook included.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; border:2px solid #EE7203; border-radius:14px; padding:40px 44px; display:flex; flex-direction:column; gap:20px; background:#FFF4E8;\">\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:2px; color:#EE7203; font-weight:600;\"><span>3 · LIFT<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0; font-size:28px; line-height:1.55;\"><span>Superpose the same shipments — chord to arc, weights to square roots. A rim point, no notebook: <\u002Fspan><em>purification.<\u002Fem><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; justify-content:center; gap:34px; margin-top:60px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:30px; padding:22px 44px; border:2px solid #AFE0F7; border-radius:10px; background:#FFFFFF; display:flex; flex-direction:column; align-items:center; gap:8px;\"><span>N = λ₊ · (e₊e₊) + λ₋ · (e₋e₋)<\u002Fspan><span style=\"font-size:24px; color:#5C6E8F;\">a mixture — the + means \"or\": either/or, decided<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:30px; padding:22px 44px; border:2px solid #EE7203; border-radius:10px; background:#FFF4E8; display:flex; flex-direction:column; align-items:center; gap:8px;\"><span>Ψ = √λ₊ · (e₊e₊) <strong>+<\u002Fstrong> √λ₋ · (e₋e₋)<\u002Fspan><span style=\"font-size:24px; color:#5C6E8F;\">a superposition — the + means \"and\": both at once<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:44px auto 0; max-width:1350px; font-size:30px; line-height:1.55; text-align:center; color:#5C6E8F;\"><span>One-sided questions cannot tell Ψ from the notebook.<\u002Fspan><\u002Fp>\n    <p style=\"margin:8px auto 0; max-width:1350px; font-size:30px; line-height:1.55; text-align:center; color:#5C6E8F;\"><span>Only questions that touch <\u002Fspan><em>both halves at once<\u002Fem><span> see the difference.<\u002Fspan><\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Concurrence\" data-speaker-notes=\"Draw the recipe in its own arena, the eigen-corner disk: the notebook N on the floor at λ+, and Ψ directly above on the rim. The climb between them is the lift of step 6, one floor up. Height h = √(λ+λ−) = √(det ρ). And the concurrence — the standard measure of entanglement — is exactly twice the lift height. The vertical coordinate drawn since the bowl was built IS entanglement with the purifying partner. Slide to the rim: C = 0, pure states purify themselves. Slide to the center: C = 1, amplitudes (1/√2, 0, 0, 1/√2) — the mystery coin, honestly purified, IS the Bell pair. The ladder: 'about' becomes 'inside', floor by floor, each rung a square root; classically the chain never ends, quantum lets it stop — at a pure pair. That stopping point is entanglement.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>⊗ 5 — WHAT THE LIFT HEIGHT REALLY WAS<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>The lift height is the entanglement<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>In the eigen-corner's disk the notebook N sits on the floor; Ψ stands directly above it on the rim. The climb between them is <\u002Fspan><strong>the lift<\u002Fstrong><span> — one floor up.<\u002Fspan><\u002Fp>\n        <sc-if value=\"{{ showFormulas }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"align-self:flex-start; font-family:'IBM Plex Mono', monospace; font-size:25px; padding:14px 24px; border:1.5px solid #AFE0F7; border-radius:8px; background:#FFF4E8; display:flex; flex-direction:column; gap:4px;\"><span style=\"white-space:nowrap;\">C = 2·√(λ₊λ₋) = 2 × lift height<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n        <p style=\"margin:0;\"><span>The <\u002Fspan><strong>concurrence<\u002Fstrong><span> — the standard measure of entanglement — is exactly <\u002Fspan><em>twice the lift height<\u002Fem><span>. The vertical coordinate you have drawn since the bowl was built <\u002Fspan><em>is<\u002Fem><span> the entanglement with the purifying partner.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>At the rim: C = 0 — pure states purify themselves. At the center: C = 1 — the mystery coin, honestly purified, <\u002Fspan><strong>is the Bell pair<\u002Fstrong><span>.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:26px;\">\n        <svg sc-camel-view-box=\"0 0 900 540\" style=\"width:100%; display:block;\">\n          <line x1=\"90\" y1=\"430\" x2=\"810\" y2=\"430\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fline>\n          <path d=\"M 150 430 A 300 300 0 0 1 750 430\" fill=\"none\" stroke=\"#EE7203\" stroke-width=\"4\" stroke-dasharray=\"10 9\"><\u002Fpath>\n          <circle cx=\"150\" cy=\"430\" r=\"9\" fill=\"#002157\"><\u002Fcircle>\n          <circle cx=\"750\" cy=\"430\" r=\"9\" fill=\"#002157\"><\u002Fcircle>\n          <text x=\"150\" y=\"474\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">e₋e₋<\u002Ftext>\n          <text x=\"750\" y=\"474\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">e₊e₊<\u002Ftext>\n          <line x1=\"510\" y1=\"430\" x2=\"510\" y2=\"136\" stroke=\"#EE7203\" stroke-width=\"3\" stroke-dasharray=\"5 5\"><\u002Fline>\n          <circle cx=\"510\" cy=\"430\" r=\"11\" fill=\"#00A1E4\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <circle cx=\"510\" cy=\"136\" r=\"12\" fill=\"#EE7203\" stroke=\"#002157\" stroke-width=\"3\"><\u002Fcircle>\n          <text x=\"510\" y=\"508\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#00A1E4\">N — on the floor at λ₊<\u002Ftext>\n          <text x=\"540\" y=\"126\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#EE7203\">Ψ — on the rim<\u002Ftext>\n          <text x=\"496\" y=\"290\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#002157\">lift h = √(det ρ)<\u002Ftext>\n          <text x=\"450\" y=\"60\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">the eigen-corner: span{e₊e₊, e₋e₋}<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Bell's test\" data-speaker-notes=\"One objection survives, and it is correct: the glued coins lost only because they carried a single shared fact. The cleverest classical factory ships each pair a complete ANSWER SHEET — a pre-agreed answer for every question, identical in both halves. It beats the same-question tester: 100% agreement at every δ. The sharper tester asks the two halves DIFFERENT questions — the CHSH game: three combinations win on agreement, the fourth on disagreement. Algebra: any answer sheet lands S on ±2, winning at most 75% — Bell's inequality; no notebook factory can pass the wall. The Bell pair, answering with the cosine ruler, reaches S = 2√2: 85.4%, through the wall. Aspect, Clauser and Zeilinger ran this game in the lab — Nobel Prize 2022. Nature carries no answer sheet.\" style=\"display:flex; flex-direction:column; padding:90px 100px 80px; background:#FFFFFF; color:#002157; font-family:'Fraunces', Georgia, serif; box-sizing:border-box;\">\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:3px; color:#EE7203; font-weight:600;\"><span>⊗ 6 — THE CLEVEREST FACTORY<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:64px; font-weight:600; margin:0; letter-spacing:-1px;\"><span>Bell's test: no answer sheet passes the wall<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:70px; flex:1; align-items:center; margin-top:30px;\">\n      <div style=\"width:620px; display:flex; flex-direction:column; gap:28px; font-size:30px; line-height:1.55;\">\n        <p style=\"margin:0;\"><span>A last classical hope: ship every pair a complete <\u002Fspan><strong>answer sheet<\u002Fstrong><span> — one pre-agreed answer per question, identical in both halves. It fools the same-question tester perfectly.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>So ask the halves <\u002Fspan><strong>different questions<\u002Fstrong><span> — the CHSH game. The algebra is merciless: every sheet wins at most <\u002Fspan><strong>75%<\u002Fstrong><span> of rounds. That wall is <\u002Fspan><strong>Bell's inequality<\u002Fstrong><span>.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0;\"><span>The Bell pair, answering by the cosine ruler, wins <\u002Fspan><strong style=\"color:#EE7203;\">85.4%<\u002Fstrong><span> — straight through the wall.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; color:#5C6E8F;\"><span>Aspect, Clauser and Zeilinger played this game in the lab — Nobel Prize 2022. Nature carries no answer sheet.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1; align-self:stretch; border:2px solid #AFE0F7; border-radius:14px; background-color:#FFFFFF; background-image:repeating-linear-gradient(to right, #E1F3FC 0 1.5px, transparent 1.5px 42px), repeating-linear-gradient(to bottom, #E1F3FC 0 1.5px, transparent 1.5px 42px); display:flex; align-items:center; justify-content:center; padding:30px;\">\n        <svg sc-camel-view-box=\"0 0 900 480\" style=\"width:100%; display:block;\">\n          <text x=\"80\" y=\"60\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" fill=\"#5C6E8F\">win rate in the CHSH game<\u002Ftext>\n          <rect x=\"80\" y=\"100\" width=\"740\" height=\"52\" rx=\"8\" fill=\"none\" stroke=\"#AFE0F7\" stroke-width=\"2\"><\u002Frect>\n          <rect x=\"80\" y=\"100\" width=\"555\" height=\"52\" rx=\"8\" fill=\"#00A1E4\" fill-opacity=\"0.75\"><\u002Frect>\n          <text x=\"94\" y=\"135\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#FFFFFF\">every answer sheet · ≤ 75%<\u002Ftext>\n          <rect x=\"80\" y=\"190\" width=\"740\" height=\"52\" rx=\"8\" fill=\"none\" stroke=\"#AFE0F7\" stroke-width=\"2\"><\u002Frect>\n          <rect x=\"80\" y=\"190\" width=\"632\" height=\"52\" rx=\"8\" fill=\"#EE7203\"><\u002Frect>\n          <text x=\"94\" y=\"225\" text-anchor=\"start\" font-family=\"IBM Plex Mono, monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#FFFFFF\">Bell pair · 85.4% = cos²(π/8)<\u002Ftext>\n          <line x1=\"635\" y1=\"70\" x2=\"635\" y2=\"280\" stroke=\"#F71D25\" stroke-width=\"4\" stroke-dasharray=\"8 7\"><\u002Fline>\n          <text x=\"635\" y=\"322\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" font-weight=\"600\" fill=\"#F71D25\">the wall at 75% — Bell's inequality<\u002Ftext>\n          <text x=\"450\" y=\"420\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"25\" fill=\"#5C6E8F\">S ≤ 2 for every notebook · S = 2√2 ≈ 2.83 for the Bell pair<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <\u002Fsc-if>\n\n<\u002Fx-import>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showFormulas&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;includeBonus&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showFormulas: this.props.showFormulas ?? true,\n      includeBonus: this.props.includeBonus ?? true,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
